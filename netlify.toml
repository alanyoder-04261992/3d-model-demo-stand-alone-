# Client designer + Owner/Admin portal on Netlify.
# npm run build uses an explicit shipping list; source, skills and private data
# are never published. tools/site-profiles.mjs recognizes Alan's existing
# learning-preview site by SITE_ID. New client sites default to customer-only.
# /c/<id>/ loads a static company; /d/<slug>/ is served by dealer-page with
# the lot's current allowed embed origins. /api routes enforce account scope.
# Re-run node tools/build-headers.mjs after inline index script changes.

[build]
  command = "npm run build"
  publish = "dist"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"
  included_files = ["library/**", "companies/demo/company.json", "companies/starter/company.json"]

[[redirects]]
  from = "/portal"
  to = "/portal.html"
  status = 200

[[redirects]]
  from = "/portal/"
  to = "/portal.html"
  status = 200

# --- 1. the company's own address ------------------------------------------

[[redirects]]
  from = "/c/:id/ui/*"
  to = "/ui/:splat"
  status = 200

[[redirects]]
  from = "/c/:id/engine/*"
  to = "/engine/:splat"
  status = 200

[[redirects]]
  from = "/c/:id/model/*"
  to = "/model/:splat"
  status = 200

[[redirects]]
  from = "/c/:id/parts/*"
  to = "/parts/:splat"
  status = 200

[[redirects]]
  from = "/c/:id/library/*"
  to = "/library/:splat"
  status = 200

[[redirects]]
  from = "/c/:id/companies/*"
  to = "/companies/:splat"
  status = 200

[[redirects]]
  from = "/c/:id/fonts/*"
  to = "/fonts/:splat"
  status = 200

[[redirects]]
  from = "/c/:id/*"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/c/:id"
  to = "/index.html"
  status = 200

# --- not part of the website -------------------------------------------------

[[redirects]]
  from = "/tools/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/test/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/.claude/*"
  to = "/404.html"
  status = 404
  force = true

# --- 2. how long a browser may keep each file ------------------------------

[[headers]]
  for = "/engine/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/model/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/parts/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/ui/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/library/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/companies/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
    Access-Control-Allow-Origin = "*"

[[headers]]
  for = "/embed.js"
  [headers.values]
    Cache-Control = "public, max-age=300"
