# The 3D designer and the Dealer Center on Netlify.
#
# npm run build (tools/build-site.mjs) ships an explicit list of files into
# dist/: the designer, the Dealer Center (dealer.html + one bundled script),
# fonts, the builder's library and the example companies. Source, skills,
# tools, docs and server code are never published. tools/site-profiles.mjs
# recognizes Alan's learning-preview site by SITE_ID; every other site gets
# the customer-only build.
#
# The functions (netlify/functions/):
#   office-api.mts    the Dealer Center's API (/api/office/*) and each lot's
#                     public price list and quote requests (/api/lots/*);
#                     every rule about who may see or change what is checked
#                     there (server/office/, contract: docs/OFFICE.md)
#   lot-designer.mts  a lot's 3D designer (/d/<lot>/), sent with that lot's
#                     own list of websites allowed to show it in a frame
#   tenant-diagnostics.mts, barnwright-check-in.mts
#                     only for a business connected to Barnwright's control
#                     room: its support check, and a check-in every six
#                     hours (server/office/account.js)
# /c/<id>/ still opens a company's designer from its settings file.
# Re-run node tools/build-headers.mjs after editing index.html's inline scripts.

[build]
  command = "npm run build"
  publish = "dist"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"
  included_files = ["library/**", "companies/demo/company.json", "companies/starter/company.json"]

# --- the Dealer Center --------------------------------------------------------

[[redirects]]
  from = "/dealer"
  to = "/dealer.html"
  status = 200

[[redirects]]
  from = "/dealer/"
  to = "/dealer"
  status = 301

# old addresses of the dealer software: bookmarks and old emails still arrive

[[redirects]]
  from = "/office"
  to = "/dealer"
  status = 301

[[redirects]]
  from = "/office/"
  to = "/dealer"
  status = 301

[[redirects]]
  from = "/portal"
  to = "/dealer"
  status = 301

[[redirects]]
  from = "/portal/"
  to = "/dealer"
  status = 301

[[redirects]]
  from = "/portal.html"
  to = "/dealer"
  status = 301

# --- 1. the company's own address ------------------------------------------

[[redirects]]
  from = "/c/:id/ui/*"
  to = "/ui/:splat"
  status = 200

[[redirects]]
  from = "/c/:id/engine/*"
  to = "/engine/:splat"
  status = 200

[[redirects]]
  from = "/c/:id/model/*"
  to = "/model/:splat"
  status = 200

[[redirects]]
  from = "/c/:id/parts/*"
  to = "/parts/:splat"
  status = 200

[[redirects]]
  from = "/c/:id/library/*"
  to = "/library/:splat"
  status = 200

[[redirects]]
  from = "/c/:id/companies/*"
  to = "/companies/:splat"
  status = 200

[[redirects]]
  from = "/c/:id/fonts/*"
  to = "/fonts/:splat"
  status = 200

[[redirects]]
  from = "/c/:id/*"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/c/:id"
  to = "/index.html"
  status = 200

# --- not part of the website -------------------------------------------------

[[redirects]]
  from = "/tools/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/test/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/.claude/*"
  to = "/404.html"
  status = 404
  force = true

# --- 2. how long a browser may keep each file ------------------------------

[[headers]]
  for = "/engine/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/model/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/parts/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/ui/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/library/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/companies/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
    Access-Control-Allow-Origin = "*"

[[headers]]
  for = "/embed.js"
  [headers.values]
    Cache-Control = "public, max-age=300"
