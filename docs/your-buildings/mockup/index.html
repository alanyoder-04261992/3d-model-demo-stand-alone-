<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Your Buildings</title>
<style>
/* Your Buildings: a clickable mockup of the Dealer Center's Buildings screen.
   Layout: the real Dealer Center (black and gold frame, side menu, warm off-white page)
   shown as one app window inside a 16 px page gutter; cards of buildings with pictures. */
:root {
  --page: #E8E4DC;          /* around the app window */
  --bg: #F4F2ED;            /* the Dealer Center's page */
  --card: #FFFFFF;
  --card-2: #FBFAF6;
  --hover: #FAF8F2;
  --field: #FFFFFF;
  --ink: #1D1A15;
  --heading: #16130E;
  --muted: #635D52;
  --faint: #918A7D;
  --line: #E5E0D5;
  --line-strong: #CFC7B7;
  --frame: #16130E;         /* header, side menu, save bar */
  --frame-edge: #CFC7B7;
  --frame-line: rgba(201, 162, 39, .55);
  --frame-grid: rgba(255, 255, 255, .045);
  --on-frame: #FFFFFF;
  --on-frame-soft: rgba(255, 255, 255, .78);
  --on-frame-06: rgba(255, 255, 255, .06);
  --on-frame-12: rgba(255, 255, 255, .12);
  --on-frame-25: rgba(255, 255, 255, .25);
  --on-frame-45: rgba(255, 255, 255, .45);
  --side-text: #BDB5A5;
  --gold: #C9A227;
  --gold-bright: #E2BE4E;
  --gold-deep: #85660F;
  --gold-soft: #F6EED6;
  --gold-line: #E4D29B;
  --gold-ink: #5E480C;
  --gold-tint: rgba(201, 162, 39, .14);
  --on-gold: #16130E;
  --focus: #A67C00;
  --focus-ring: rgba(201, 162, 39, .3);
  --btn-dark: #16130E;
  --btn-dark-hover: #2E2920;
  --on-btn-dark: #FFFFFF;
  --on-btn-dark-mark: #E2BE4E;
  --good: #2E7D32;
  --good-bg: #E4F2E5;
  --good-line: #BFDFC0;
  --warn: #8F5300;
  --warn-bg: #FCF0D9;
  --bad: #B3261E;
  --bad-bg: #FBE7E5;
  --bad-line: #F0C4BF;
  --pic-bg: #E9E9E5;
  --sketch-wall: #FFFFFF;
  --sketch-roof: #2B2722;
  --sketch-ghost: #A39B8C;
  --sketch-floor: #B08A5A;
  --toast-bg: #1D1A15;
  --on-toast: #FFFFFF;
  --toast-mark: #8FD694;
  --toast-info: #E2BE4E;
  --toast-warn: #F5B25C;
  --mock-bg: #FFF7DE;
  --mock-ink: #5E480C;
  --mock-line: #C9A227;
  --scrim: rgba(22, 19, 14, .5);
  --shadow: 0 1px 2px rgba(22, 19, 14, .06), 0 3px 10px rgba(22, 19, 14, .05);
  --shadow-up: 0 10px 30px rgba(22, 19, 14, .22);
  --shadow-app: 0 2px 6px rgba(22, 19, 14, .06), 0 18px 40px rgba(22, 19, 14, .08);
  --bar-lift: 0 -6px 14px rgba(20, 16, 8, .18);

  --head: "Oswald", "Arial Narrow", "Helvetica Neue", sans-serif;
  --body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --radius: 10px;
  --side: 224px;
  --top: 60px;
  --mx: clamp(16px, 3vw, 38px);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --page: #090807; --bg: #131210; --card: #1C1A16; --card-2: #201D19; --hover: #25221C; --field: #15130F;
    --ink: #ECE6D9; --heading: #F6F0E4; --muted: #B5AC9B; --faint: #8A8274; --line: #302C25; --line-strong: #4A443B;
    --frame: #0C0B09; --frame-edge: #2E2A23; --on-frame: #F6F0E4; --side-text: #ADA593;
    --gold-deep: #E2BE4E; --gold-soft: #2A2414; --gold-line: #5C4B1C; --gold-ink: #F0D58A; --gold-tint: rgba(226, 190, 78, .16);
    --focus: #E2BE4E; --focus-ring: rgba(226, 190, 78, .35);
    --btn-dark: #ECE6D9; --btn-dark-hover: #FFFFFF; --on-btn-dark: #16130E; --on-btn-dark-mark: #85660F;
    --good: #8AD18E; --good-bg: #16261A; --good-line: #2D5332; --warn: #F2B766; --warn-bg: #2B2112;
    --bad: #FF9088; --bad-bg: #2E1716; --bad-line: #5E2A27;
    --pic-bg: #D8D8D3; --sketch-wall: #2A2721; --sketch-roof: #DCD5C7; --sketch-ghost: #7D7567; --sketch-floor: #9C7A4F;
    --toast-bg: #ECE6D9; --on-toast: #16130E; --toast-mark: #2E7D32; --toast-info: #85660F; --toast-warn: #9A4B00;
    --mock-bg: #241F12; --mock-ink: #F0D58A; --mock-line: #8C7224;
    --scrim: rgba(0, 0, 0, .62);
    --shadow: 0 1px 2px rgba(0, 0, 0, .35), 0 3px 10px rgba(0, 0, 0, .25);
    --shadow-up: 0 12px 34px rgba(0, 0, 0, .55);
    --shadow-app: 0 2px 6px rgba(0, 0, 0, .4), 0 18px 40px rgba(0, 0, 0, .35);
    --bar-lift: 0 -10px 18px rgba(0, 0, 0, .6);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --page: #090807; --bg: #131210; --card: #1C1A16; --card-2: #201D19; --hover: #25221C; --field: #15130F;
  --ink: #ECE6D9; --heading: #F6F0E4; --muted: #B5AC9B; --faint: #8A8274; --line: #302C25; --line-strong: #4A443B;
  --frame: #0C0B09; --frame-edge: #2E2A23; --on-frame: #F6F0E4; --side-text: #ADA593;
  --gold-deep: #E2BE4E; --gold-soft: #2A2414; --gold-line: #5C4B1C; --gold-ink: #F0D58A; --gold-tint: rgba(226, 190, 78, .16);
  --focus: #E2BE4E; --focus-ring: rgba(226, 190, 78, .35);
  --btn-dark: #ECE6D9; --btn-dark-hover: #FFFFFF; --on-btn-dark: #16130E; --on-btn-dark-mark: #85660F;
  --good: #8AD18E; --good-bg: #16261A; --good-line: #2D5332; --warn: #F2B766; --warn-bg: #2B2112;
  --bad: #FF9088; --bad-bg: #2E1716; --bad-line: #5E2A27;
  --pic-bg: #D8D8D3; --sketch-wall: #2A2721; --sketch-roof: #DCD5C7; --sketch-ghost: #7D7567; --sketch-floor: #9C7A4F;
  --toast-bg: #ECE6D9; --on-toast: #16130E; --toast-mark: #2E7D32; --toast-info: #85660F; --toast-warn: #9A4B00;
  --mock-bg: #241F12; --mock-ink: #F0D58A; --mock-line: #8C7224;
  --scrim: rgba(0, 0, 0, .62);
  --shadow: 0 1px 2px rgba(0, 0, 0, .35), 0 3px 10px rgba(0, 0, 0, .25);
  --shadow-up: 0 12px 34px rgba(0, 0, 0, .55);
  --shadow-app: 0 2px 6px rgba(0, 0, 0, .4), 0 18px 40px rgba(0, 0, 0, .35);
  --bar-lift: 0 -10px 18px rgba(0, 0, 0, .6);
  color-scheme: dark;
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; scroll-padding-top: calc(var(--top) + 16px); scroll-padding-bottom: var(--bar-h, 0px); }
body { margin: 0; background: var(--page); color: var(--ink); font: 400 16px/1.5 var(--body); }
button, input, select, textarea { font: inherit; color: inherit; }
a { color: var(--gold-deep); text-underline-offset: 3px; }
h1, h2, h3, p { margin: 0; }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; border-radius: 4px; }
[hidden] { display: none !important; }
.icon { width: 20px; height: 20px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.num { font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }

/* ---- the page around the app ---- */
.wrap { padding-inline: 16px; padding-block: 12px 28px; max-width: 1480px; margin: 0 auto; }
.mock {
  display: flex; flex-wrap: wrap; align-items: center; gap: 0 14px; padding: 0 6px 0 12px; margin-bottom: 10px;
  border: 1px dashed var(--mock-line); border-radius: 10px; background: var(--mock-bg); color: var(--mock-ink); font-size: 14px;
}
.mock-words { display: flex; align-items: center; gap: 10px; min-height: 44px; flex-wrap: wrap; }
.mock-tag { font: 600 12.5px/1 var(--head); letter-spacing: .14em; text-transform: uppercase; padding: 4px 8px; border-radius: 5px; background: var(--gold); color: var(--on-gold); }
.mock-links { display: flex; flex-wrap: wrap; margin-left: auto; }
.mock-link { min-height: 44px; padding: 0 10px; background: none; border: 0; color: var(--mock-ink); text-decoration: underline; text-underline-offset: 3px; font-weight: 600; cursor: pointer; font-size: 14px; }
.mock-where { display: none; }
.mock-foot { display: none; justify-content: center; flex-wrap: wrap; margin-top: 12px; padding: 0 6px; border: 1px dashed var(--mock-line); border-radius: 10px; background: var(--mock-bg); }

/* ---- the app window ---- */
.app { border: 1px solid var(--frame-edge); border-radius: 14px; overflow: clip; background: var(--bg); box-shadow: var(--shadow-app); }
.topbar {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 30; height: var(--top);
  display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 0 14px;
  color: var(--on-frame); background-color: var(--frame);
  background-image: linear-gradient(var(--frame-grid) 1px, transparent 1px), linear-gradient(90deg, var(--frame-grid) 1px, transparent 1px);
  background-size: 22px 22px; box-shadow: 0 1px 0 var(--frame-line);
}
.brand { display: flex; align-items: center; gap: 11px; min-width: 0; }
.brand-initials { width: 38px; height: 38px; flex: none; border-radius: 8px; display: grid; place-items: center; background: var(--gold); color: var(--on-gold); font: 600 17px/1 var(--head); letter-spacing: .04em; }
.brand-words { display: flex; flex-direction: column; min-width: 0; line-height: 1.1; }
.brand-words strong { font: 600 18px/1.1 var(--head); letter-spacing: .07em; text-transform: uppercase; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.brand-words span { font-size: 12px; color: var(--on-frame-soft); letter-spacing: .03em; }
.top-tools { display: flex; align-items: center; gap: 8px; flex: none; }
.lot-pill { display: inline-flex; align-items: center; gap: 6px; min-height: 38px; padding: 0 12px; border-radius: 8px; border: 1px solid var(--on-frame-25); background: var(--on-frame-06); color: var(--on-frame); font-size: 15px; white-space: nowrap; }
.lot-pill .icon { width: 18px; height: 18px; color: var(--on-frame-soft); }
.top-btn { display: inline-flex; align-items: center; justify-content: center; gap: 7px; min-height: 44px; min-width: 44px; padding: 0 12px; border-radius: 8px; font-weight: 600; font-size: 14px; cursor: pointer; white-space: nowrap; }
.top-btn.gold { background: var(--gold); color: var(--on-gold); border: 0; }
.top-btn.quiet { background: var(--on-frame-06); color: var(--on-frame); border: 1px solid var(--on-frame-25); }
.top-btn .icon { width: 18px; height: 18px; }
.avatar { width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; background: var(--on-frame-12); box-shadow: inset 0 0 0 1.5px var(--gold); color: var(--gold-bright); font: 600 13px/1 var(--body); }
.person { display: flex; align-items: center; gap: 8px; font-size: 14px; }

.app-body { display: grid; grid-template-columns: var(--side) minmax(0, 1fr); background: linear-gradient(to right, var(--frame) var(--side), var(--bg) var(--side)); }
.sidenav { position: sticky; top: var(--top); align-self: start; padding: 18px 12px; display: flex; flex-direction: column; gap: 2px; }
.nav-item { display: flex; align-items: center; gap: 12px; min-height: 44px; padding: 10px 12px; border-radius: 8px; color: var(--side-text); background: none; border: 0; font-weight: 500; text-align: left; cursor: pointer; }
.nav-item:hover { background: var(--on-frame-06); color: var(--on-frame); }
.nav-item.on { background: var(--gold-tint); color: var(--gold-bright); font-weight: 600; box-shadow: inset 3px 0 0 var(--gold); }
.main { min-width: 0; padding: 26px var(--mx) 48px; }
.tabbar { display: none; }

/* ---- shared pieces ---- */
.back { display: inline-flex; align-items: center; gap: 6px; min-height: 44px; color: var(--muted); background: none; border: 0; padding: 0; font-size: 15px; cursor: pointer; margin: -8px 0 2px; }
.back:hover { color: var(--ink); }
.back .icon { width: 18px; height: 18px; }
.page-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px 16px; flex-wrap: wrap; margin-bottom: 10px; }
.page-head h1 { font: 500 clamp(26px, 3vw, 34px)/1.15 var(--head); letter-spacing: .02em; color: var(--heading); text-wrap: balance; }
.page-head p { color: var(--muted); margin-top: 4px; max-width: 70ch; }
.jump { display: flex; flex-wrap: wrap; gap: 8px; margin: 2px 0 16px; }
.jump-btn { display: inline-flex; align-items: center; gap: 8px; min-height: 44px; padding: 8px 14px; border-radius: 22px; border: 1px solid var(--line-strong); background: var(--card); color: var(--heading); font-weight: 600; font-size: 14.5px; cursor: pointer; }
.jump-btn:hover { border-color: var(--gold); background: var(--gold-soft); }
.jump-btn .icon { width: 17px; height: 17px; color: var(--gold-deep); }
.card-title[tabindex]:focus { outline: none; }
h1:focus { outline: none; }
.stamp { display: flex; flex-wrap: wrap; gap: 4px 18px; color: var(--muted); font-size: 14px; margin: 0 0 16px; }
.stamp span { display: inline-flex; align-items: center; gap: 6px; }
.stamp .icon { width: 16px; height: 16px; }
.tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--line); margin-bottom: 20px; overflow-x: auto; scrollbar-width: none; }
.tab { display: inline-flex; align-items: center; gap: 8px; min-height: 46px; padding: 10px 14px; border: 0; background: none; cursor: pointer; color: var(--muted); font-weight: 600; border-bottom: 3px solid transparent; margin-bottom: -1px; white-space: nowrap; }
.tab[aria-selected="true"] { color: var(--heading); border-bottom-color: var(--gold); }
.count { font-size: 12px; font-weight: 600; padding: 1px 7px; border-radius: 10px; background: var(--line); color: var(--muted); }
.card { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); padding: 18px 20px; min-width: 0; }
.card-title { font: 500 15px/1.2 var(--head); letter-spacing: .12em; text-transform: uppercase; color: var(--heading); margin: 0 0 12px; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.card-title .icon { color: var(--gold-deep); }
.card-sub { color: var(--muted); font-size: 14.5px; margin: -4px 0 14px; max-width: 70ch; }
.hint { color: var(--muted); font-size: 13.5px; line-height: 1.4; }

.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 44px; padding: 9px 16px;
  border-radius: 8px; border: 1px solid transparent; font-weight: 600; font-size: 15px; line-height: 1.2; cursor: pointer; white-space: nowrap;
  transition: background .15s, border-color .15s;
}
.btn .icon { width: 18px; height: 18px; }
.btn-block { width: 100%; }
.btn-primary { background: var(--btn-dark); color: var(--on-btn-dark); }
.btn-primary:hover { background: var(--btn-dark-hover); }
.btn-accent { background: var(--gold); color: var(--on-gold); }
.btn-accent:hover { background: var(--gold-bright); }
.btn-ghost { background: var(--card); color: var(--heading); border-color: var(--line-strong); }
.btn-ghost:hover { border-color: var(--heading); }
.btn-danger { background: var(--bad); color: var(--card); }
.btn-danger-ghost { background: var(--card); color: var(--bad); border-color: var(--bad-line); }
.btn-danger-ghost:hover { border-color: var(--bad); }
.btn-link { background: none; border: 0; color: var(--gold-deep); padding: 0 2px; min-height: 44px; text-decoration: underline; text-underline-offset: 3px; font-weight: 600; font-size: 14px; cursor: pointer; }
.btn:disabled { opacity: .6; cursor: progress; }
.pill { display: inline-flex; align-items: center; gap: 6px; padding: 2px 10px; border-radius: 20px; font-size: 12.5px; font-weight: 600; white-space: nowrap; background: var(--line); color: var(--muted); }
.pill::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
.pill.good { background: var(--good-bg); color: var(--good); }
.pill.gold { background: var(--gold-soft); color: var(--gold-ink); }
.pill.plain::before { display: none; }

input:not([type=checkbox]), select {
  width: 100%; min-width: 0; min-height: 44px; padding: 9px 12px; border: 1px solid var(--line-strong); border-radius: 8px;
  background: var(--field); color: var(--ink);
}
input::placeholder { color: var(--faint); }
input:focus, select:focus { outline: none; border-color: var(--focus); box-shadow: 0 0 0 3px var(--focus-ring); }
input.bad { border-color: var(--bad); background: var(--bad-bg); }
.field { display: grid; gap: 6px; align-content: start; min-width: 0; }
.field > label, .label { font-weight: 600; font-size: 14px; }
.err { color: var(--bad); font-size: 14px; font-weight: 500; display: flex; gap: 6px; align-items: flex-start; }
.err .icon { width: 16px; height: 16px; margin-top: 2px; }
.err:empty { display: none; }
.check { display: flex; gap: 10px; align-items: flex-start; cursor: pointer; min-height: 44px; padding-top: 10px; }
.check input { width: 20px; height: 20px; margin: 2px 0 0; accent-color: var(--gold-deep); flex: none; }
.check small { display: block; color: var(--muted); font-size: 13.5px; }

/* ---- Your buildings ---- */
.sec-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px 18px; flex-wrap: wrap; margin-bottom: 14px; }
.sec-title { font: 500 22px/1.2 var(--head); letter-spacing: .03em; color: var(--heading); }
.sec-sub { color: var(--muted); margin-top: 2px; }
.sec-sub strong { color: var(--ink); }
.actions { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.bgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 210px), 1fr)); gap: 16px; }
.bcard { display: flex; flex-direction: column; background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); overflow: hidden; min-width: 0; }
.bcard.fresh { animation: fresh 2.4s ease-out; }
@keyframes fresh { from { box-shadow: 0 0 0 4px var(--gold), var(--shadow); } to { box-shadow: 0 0 0 0 var(--gold), var(--shadow); } }
.bpic { position: relative; display: block; width: 100%; aspect-ratio: 4 / 3; padding: 0; border: 0; background: var(--pic-bg); overflow: hidden; cursor: pointer; }
.bpic img { display: block; width: 100%; height: 100%; object-fit: cover; transform: scale(1.14); transition: transform .3s; }
.bpic:hover img { transform: scale(1.18); }
.bpic.old img, .hero.old .hero-pic img { filter: grayscale(.75) contrast(.9); opacity: .7; }
.oldchip { position: absolute; left: 8px; right: 8px; bottom: 8px; display: none; align-items: flex-start; gap: 6px; padding: 5px 9px; border-radius: 8px; background: var(--btn-dark); color: var(--on-btn-dark); font-size: 12px; font-weight: 600; line-height: 1.3; text-align: left; }
.oldchip .icon { width: 14px; height: 14px; flex: none; margin-top: 1px; color: var(--on-btn-dark-mark); }
.bpic.old .oldchip, .hero.old .oldchip { display: flex; }
.hero .oldchip { left: 10px; right: auto; top: 10px; bottom: auto; max-width: calc(100% - 20px); font-size: 13px; }
.hero.old figcaption { color: var(--gold-ink); background: var(--gold-soft); border-top-color: var(--gold-line); }
.badge { position: absolute; left: 8px; top: 8px; display: inline-flex; align-items: center; gap: 5px; padding: 3px 9px; border-radius: 20px; font-size: 12px; font-weight: 600; background: var(--btn-dark); color: var(--on-btn-dark); }
.badge .icon { width: 14px; height: 14px; color: var(--on-btn-dark-mark); }
.binfo { padding: 12px 14px 0; display: grid; gap: 2px; min-width: 0; }
.bname { font: 600 17px/1.25 var(--body); color: var(--heading); overflow-wrap: anywhere; }
.bver { font-size: 13px; color: var(--gold-deep); font-weight: 600; }
.bmeta { color: var(--muted); font-size: 14px; }
.bprice { font-size: 15px; color: var(--ink); }
.bprice strong { font-variant-numeric: tabular-nums; }
.bbuilt { margin: 8px 14px 0; font-size: 13.5px; line-height: 1.35; color: var(--muted); display: flex; gap: 7px; align-items: flex-start; }
.bbuilt .icon { width: 16px; height: 16px; margin-top: 1px; }
.bbuilt.own { color: var(--gold-ink); background: var(--gold-soft); border: 1px solid var(--gold-line); border-radius: 8px; padding: 6px 9px; }
.bedit { margin-top: auto; padding: 12px 14px 14px; }
.picnote { display: flex; gap: 14px; align-items: center; padding: 10px 14px; margin: -2px 0 16px; border: 1px solid var(--line); border-radius: var(--radius); background: var(--card-2); }
.picnote p { font-size: 14px; color: var(--muted); max-width: 86ch; }
.picnote strong { color: var(--ink); font-weight: 600; }
.picnote-pics { display: flex; flex: none; }
.picnote-pics img { width: 64px; height: 48px; object-fit: cover; border-radius: 6px; border: 2px solid var(--card); background: var(--pic-bg); }
.picnote-pics img + img { margin-left: -18px; }
.addcard {
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; min-height: 260px; padding: 20px;
  border: 2px dashed var(--line-strong); border-radius: var(--radius); background: transparent; color: var(--heading); cursor: pointer; text-align: center;
}
.addcard:hover { border-color: var(--gold); background: var(--gold-soft); }
.addcard .plus { width: 52px; height: 52px; border-radius: 50%; background: var(--gold); color: var(--on-gold); display: grid; place-items: center; }
.addcard .plus .icon { width: 26px; height: 26px; stroke-width: 2.2; }
.addcard strong { font-size: 17px; }
.addcard-words { display: grid; gap: 4px; justify-items: center; }
.addcard-words span { color: var(--muted); font-size: 14px; max-width: 24ch; }

.flash { display: grid; grid-template-columns: 32px minmax(0, 1fr) 44px; gap: 4px 12px; align-items: start; padding: 14px 10px 14px 16px; margin-bottom: 18px; border-radius: var(--radius); background: var(--good-bg); border: 1px solid var(--good-line); }
.flash-mark { width: 32px; height: 32px; border-radius: 50%; display: grid; place-items: center; background: var(--good); color: var(--good-bg); }
.flash-mark .icon { width: 18px; height: 18px; stroke-width: 2.4; }
.flash h2 { font: 500 19px/1.25 var(--head); letter-spacing: .02em; color: var(--good); margin-top: 3px; }
.flash p { font-size: 14.5px; margin-top: 2px; }
.flash ul { margin: 6px 0 0; padding-left: 18px; font-size: 14.5px; display: grid; gap: 2px; }
.flash-x { width: 44px; height: 44px; border: 0; background: none; border-radius: 8px; display: grid; place-items: center; color: var(--muted); cursor: pointer; }
.flash.bad { background: var(--bad-bg); border-color: var(--bad-line); }
.flash.bad .flash-mark { background: var(--bad); color: var(--bad-bg); }
.flash.bad h2 { color: var(--bad); }
.flash .fix { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }

.stopped { margin-top: 26px; }
.srows { display: grid; }
.srow { display: grid; grid-template-columns: 96px minmax(0, 1fr) auto; gap: 8px 14px; align-items: center; padding: 12px 0; border-top: 1px solid var(--line); }
.srow:first-child { border-top: 0; padding-top: 0; }
.spic { width: 96px; aspect-ratio: 4 / 3; border-radius: 7px; overflow: hidden; background: var(--pic-bg); }
.spic img { width: 100%; height: 100%; object-fit: cover; transform: scale(1.14); filter: grayscale(.7); opacity: .8; display: block; }
.sname { font-weight: 600; color: var(--heading); }
.smeta { color: var(--muted); font-size: 14px; }
.allrow { margin-top: 18px; display: flex; align-items: center; justify-content: space-between; gap: 12px 18px; flex-wrap: wrap; }
.allrow .card-title { margin-bottom: 4px; }
.allrow p { color: var(--muted); font-size: 14.5px; max-width: 64ch; }

.empty { text-align: center; padding: 44px 20px; display: grid; justify-items: center; gap: 12px; }
.empty-mark { width: 64px; height: 64px; border-radius: 16px; display: grid; place-items: center; background: var(--gold-soft); color: var(--gold-deep); }
.empty-mark .icon { width: 34px; height: 34px; stroke-width: 1.5; }
.empty h2 { font: 500 24px/1.2 var(--head); color: var(--heading); text-wrap: balance; }
.empty p { color: var(--muted); max-width: 48ch; }
.epicks { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; width: min(100%, 760px); margin: 6px 0 4px; }
.epick .gname { font-size: 15px; }

/* ---- Edit a building ---- */
.edit { display: grid; gap: 18px; grid-template-columns: minmax(0, 1fr); }
.edit-side, .edit-main { display: grid; gap: 18px; align-content: start; min-width: 0; }
.hero { margin: 0; background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; box-shadow: var(--shadow); }
.hero-pic { position: relative; aspect-ratio: 4 / 3; background: var(--pic-bg); overflow: hidden; }
.hero-pic img { display: block; width: 100%; height: 100%; object-fit: cover; transform: scale(1.06); transition: filter .35s, opacity .35s; }
.hero.stale .hero-pic img { filter: grayscale(.6) contrast(.9); opacity: .72; }
.hero-chip { position: absolute; left: 10px; top: 10px; display: none; align-items: center; gap: 6px; padding: 5px 10px; border-radius: 20px; background: var(--btn-dark); color: var(--on-btn-dark); font-size: 13px; font-weight: 600; }
.hero-chip .icon { width: 15px; height: 15px; color: var(--on-btn-dark-mark); }
.hero.stale .hero-chip { display: inline-flex; }
.hero figcaption { padding: 11px 14px 12px; font-size: 14px; color: var(--muted); border-top: 1px solid var(--line); }
.hero.stale figcaption { color: var(--gold-ink); background: var(--gold-soft); border-top-color: var(--gold-line); }
.mocknote { border: 1px dashed var(--mock-line); background: var(--mock-bg); color: var(--mock-ink); border-radius: var(--radius); padding: 12px 14px; font-size: 14px; display: grid; gap: 6px; }
.mocknote .mock-tag { justify-self: start; }
.mocknote .btn-link { color: var(--mock-ink); justify-self: start; }

.sizes-head { display: grid; grid-template-columns: 64px minmax(0, 1fr) 44px; gap: 10px; font: 600 12.5px/1.2 var(--body); letter-spacing: .06em; text-transform: uppercase; color: var(--muted); padding: 0 0 6px; }
.sizes { list-style: none; margin: 0; padding: 0; columns: 2 215px; column-gap: 28px; }
.size-row { display: grid; grid-template-columns: 64px minmax(0, 1fr) 44px; gap: 10px; align-items: center; padding: 5px 0; border-bottom: 1px solid var(--line); break-inside: avoid; }
.size-row.changed .size { position: relative; }
.size-row.changed .size::before { content: ""; position: absolute; left: -10px; top: 1px; bottom: 1px; width: 3px; border-radius: 2px; background: var(--gold); }
.size { font-weight: 600; font-variant-numeric: tabular-nums; }
.money { position: relative; display: block; min-width: 0; }
.money > span { position: absolute; left: 11px; top: 50%; transform: translateY(-50%); color: var(--muted); pointer-events: none; }
.money input { padding-left: 24px; text-align: right; font-variant-numeric: tabular-nums; }
.icon-btn { width: 44px; height: 44px; display: grid; place-items: center; border-radius: 8px; border: 0; background: none; color: var(--muted); cursor: pointer; }
.icon-btn:hover { background: var(--bad-bg); color: var(--bad); }
.addsize { margin-top: 14px; padding: 12px 14px 14px; border: 1px dashed var(--line-strong); border-radius: 10px; display: grid; gap: 8px; }
.addsize-row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.addsize-row select { flex: 1 1 120px; width: auto; }
.addsize-row #as-l { flex: 1 1 100px; width: auto; }
.addsize-row .money { flex: 1 1 120px; }
.addsize-row .btn { flex: 0 0 auto; }
.addsize-x { color: var(--muted); }

.built-intro { color: var(--muted); font-size: 14.5px; max-width: 70ch; margin: -4px 0 14px; }
.follows { display: flex; gap: 8px; align-items: flex-start; margin: -6px 0 14px; padding: 8px 12px; border-radius: 8px; background: var(--gold-soft); border: 1px solid var(--gold-line); color: var(--gold-ink); font-size: 14px; }
.follows .icon { width: 17px; height: 17px; margin-top: 1px; }
.lay-list b { color: var(--heading); }
.leftoff { color: var(--warn); font-weight: 600; }
.doors-actions { margin: 14px 0 10px; }
#sec-doors .confirm { margin: 0 0 12px; }
.endview { margin: 0 0 18px; padding: 10px 12px 8px; border: 1px solid var(--line); border-radius: 10px; background: var(--card-2); display: grid; gap: 4px; }
.endview svg { display: block; width: 100%; height: auto; max-height: 300px; }
.endview-key { display: flex; gap: 4px 16px; flex-wrap: wrap; font-size: 13px; color: var(--muted); align-items: center; }
.endview-key i { display: inline-block; width: 22px; height: 0; border-top: 3px solid var(--sketch-roof); vertical-align: middle; margin-right: 6px; }
.endview-key i.ghost { border-top: 2px dashed var(--sketch-ghost); }
.knobs { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 240px), 1fr)); gap: 18px 22px; }
.knob { display: grid; gap: 5px; align-content: start; min-width: 0; }
.knob.wide { grid-column: 1 / -1; }
.knob-label { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; font-weight: 600; font-size: 14px; }
.knob input { font-variant-numeric: tabular-nums; }
.knob .std { display: block; color: var(--ink); font-weight: 600; margin-top: 2px; }
.knob.own input { border-color: var(--gold); background: var(--gold-soft); }
.knob-row { display: flex; flex-wrap: wrap; align-items: center; gap: 0 10px; min-height: 0; }
.widths { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 150px), 1fr)); gap: 8px 12px; }
.widths label { display: grid; gap: 4px; font-size: 14px; color: var(--muted); }
.chiprow { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { display: inline-flex; align-items: center; gap: 8px; min-height: 44px; min-width: 44px; justify-content: center; padding: 6px 14px; border-radius: 22px; border: 1px solid var(--line-strong); background: var(--card); color: var(--ink); cursor: pointer; font-size: 14.5px; font-weight: 500; }
.chip[aria-pressed="true"] { background: var(--btn-dark); border-color: var(--btn-dark); color: var(--on-btn-dark); }
.chip .count { background: var(--line); }
.chip[aria-pressed="true"] .count { background: var(--on-frame-25); color: var(--on-btn-dark); }
.doors { list-style: none; margin: 0; padding: 0; display: grid; gap: 2px; }
.doors li { display: flex; gap: 10px; align-items: flex-start; padding: 7px 0; border-bottom: 1px dashed var(--line); }
.doors li:last-child { border-bottom: 0; }
.doors .icon { width: 18px; height: 18px; color: var(--gold-deep); margin-top: 3px; }
.stopcard { border-color: var(--bad-line); }
.stopcard .card-title { color: var(--bad); }
.confirm { margin-top: 12px; padding: 12px 14px; border-radius: 10px; background: var(--bad-bg); border: 1px solid var(--bad-line); display: grid; gap: 10px; }
.confirm p { font-size: 14.5px; }

.savebar {
  position: sticky; bottom: 0; z-index: 20; margin: 24px calc(-1 * var(--mx)) -48px;
  padding: 12px var(--mx) calc(12px + env(safe-area-inset-bottom, 0px));
  color: var(--on-frame); background-color: var(--frame);
  background-image: linear-gradient(var(--frame-grid) 1px, transparent 1px), linear-gradient(90deg, var(--frame-grid) 1px, transparent 1px);
  background-size: 22px 22px; box-shadow: var(--bar-lift), 0 -1px 0 var(--frame-line);
  display: flex; align-items: center; justify-content: space-between; gap: 10px 16px; flex-wrap: wrap;
}
.savebar-status { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; min-width: 0; min-height: 44px; align-content: center; }
.savebar-status strong { font: 500 19px/1.1 var(--head); letter-spacing: .04em; }
.savebar-status span { color: var(--on-frame-soft); font-size: 14px; }
.savebar-status .trouble { color: var(--gold-bright); font-weight: 600; }
.savebar-actions { display: flex; gap: 10px; flex-wrap: wrap; margin-left: auto; }
.savebar .btn-ghost { background: transparent; color: var(--on-frame); border-color: var(--on-frame-45); }
.savebar .btn-ghost:hover { border-color: var(--on-frame); }
.spinner { width: 18px; height: 18px; border-radius: 50%; border: 3px solid var(--on-frame-25); border-top-color: var(--on-gold); animation: spin .8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

/* ---- Add a building ---- */
.ggrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 200px), 1fr)); gap: 14px; }
.gtile { display: flex; flex-direction: column; text-align: left; padding: 0; overflow: hidden; cursor: pointer; background: var(--card); color: var(--ink); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); min-width: 0; }
.gtile:hover { border-color: var(--gold); }
.gpic { position: relative; width: 100%; aspect-ratio: 4 / 3; background: var(--pic-bg); overflow: hidden; }
.gpic img { display: block; width: 100%; height: 100%; object-fit: cover; transform: scale(1.14); }
.gpic .pill { position: absolute; left: 8px; top: 8px; }
.gtxt { padding: 10px 12px 12px; display: grid; gap: 2px; }
.gname { font-weight: 600; color: var(--heading); }
.gwhat { font-size: 13.5px; color: var(--muted); line-height: 1.35; }

dialog.sheet { border: 0; padding: 0; border-radius: 14px; width: min(760px, calc(100vw - 32px)); max-height: calc(100vh - 32px); background: var(--card); color: var(--ink); box-shadow: var(--shadow-up); overflow: auto; overscroll-behavior: contain; }
dialog.sheet::backdrop { background: var(--scrim, rgba(10, 9, 7, .55)); }
.sheet-head { position: sticky; top: 0; z-index: 2; display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 10px 10px 10px 20px; border-bottom: 1px solid var(--line); background: var(--card); }
.sheet-head h2 { font: 500 22px/1.2 var(--head); color: var(--heading); }
.sheet-head h2:focus { outline: none; }
.sheet-x { flex: none; width: 44px; height: 44px; border-radius: 8px; border: 0; background: none; cursor: pointer; display: grid; place-items: center; color: var(--muted); }
.sheet-x:hover { background: var(--bg); color: var(--ink); }
.sheet-body { padding: 16px 20px 18px; display: grid; gap: 16px; }
.pv-top { display: grid; gap: 16px; grid-template-columns: minmax(0, 1.2fr) minmax(0, 1fr); align-items: start; }
.pv-pic { border-radius: var(--radius); overflow: hidden; background: var(--pic-bg); aspect-ratio: 4 / 3; }
.pv-pic img { display: block; width: 100%; height: 100%; object-fit: cover; transform: scale(1.08); }
.facts { margin: 0; display: grid; gap: 0; }
.facts div { display: grid; grid-template-columns: 76px minmax(0, 1fr); gap: 10px; padding: 7px 0; border-bottom: 1px dashed var(--line); font-size: 14.5px; }
.facts dt { color: var(--muted); }
.facts dd { margin: 0; }
.pv-sub { font: 600 12.5px/1.2 var(--body); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin-bottom: 8px; }
.pv-sizes { display: flex; flex-wrap: wrap; gap: 6px; }
.pv-size { display: inline-flex; gap: 8px; align-items: baseline; padding: 4px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--card-2); font-size: 14px; font-variant-numeric: tabular-nums; }
.pv-size b { font-weight: 600; }
.pv-size span { color: var(--muted); }
.sheet-foot { position: sticky; bottom: 0; z-index: 2; display: flex; align-items: center; justify-content: flex-end; gap: 10px; flex-wrap: wrap; padding: 12px 20px; border-top: 1px solid var(--line); background: var(--card); }
.sheet-foot .pv-note { margin-right: auto; color: var(--muted); font-size: 14px; display: flex; align-items: center; gap: 8px; }

.toasts { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(22px + env(safe-area-inset-bottom, 0px)); z-index: 60; display: grid; gap: 8px; width: min(460px, calc(100vw - 32px)); pointer-events: none; }
.toast { display: flex; align-items: flex-start; gap: 10px; padding: 12px 16px; border-radius: 10px; background: var(--toast-bg); color: var(--on-toast); box-shadow: var(--shadow-up); font-size: 15px; animation: rise .2s ease-out; }
.toast .icon { color: var(--toast-mark); margin-top: 1px; }
.toast.info .icon { color: var(--toast-info); }
.toast.warn .icon { color: var(--toast-warn); }
@keyframes rise { from { opacity: 0; transform: translateY(8px); } }

/* ---- narrower screens ---- */
@media (min-width: 1100px) {
  .edit { grid-template-columns: minmax(300px, 370px) minmax(0, 1fr); align-items: start; }
  .edit-side { position: sticky; top: calc(var(--top) + 16px); }
}
@media (max-width: 1099px) {
  /* in the Claude app a 100 px header lies over the top of the page: what a
     jump or a pick scrolls to lands below it, and pop-ups start below it */
  html { scroll-padding-top: 116px; }
  dialog.sheet { margin: 116px auto 16px; max-height: calc(100vh - 132px); max-height: calc(100dvh - 132px); }
  .mock-foot { display: flex; }
  .mock .mock-links { display: none; }
  /* the note is all that sits under an app header at the top; the app's own bar starts below it */
  .mock { min-height: 88px; align-items: flex-end; padding-bottom: 6px; }
  .mock-where { display: inline; }
}
@media (max-width: 820px) {
  .tabs { flex-wrap: wrap; }
}
@media (max-width: 760px) {
  :root { --top: 56px; --mx: 16px; }
  .app-body { grid-template-columns: minmax(0, 1fr); background: var(--bg); }
  .sidenav { display: none; }
  .main { padding: 16px var(--mx) 24px; }
  .savebar { margin-bottom: -24px; }
  .brand-words, .person-name, .top-btn .wd { display: none; }
  .top-btn { padding: 0; }
  .tabbar {
    display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; position: sticky; bottom: 0; z-index: 30;
    background: var(--frame); border-top: 1px solid var(--frame-line); padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  .app.sub .tabbar { display: none; }
  .tab-item { display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 8px 2px 7px; min-height: 58px; color: var(--side-text); font-size: 11.5px; background: none; border: 0; cursor: pointer; }
  .tab-item.on { color: var(--gold-bright); font-weight: 600; }
  .toasts { bottom: calc(76px + env(safe-area-inset-bottom, 0px)); }
  .app.sub ~ .toasts { bottom: calc(86px + env(safe-area-inset-bottom, 0px)); }
  .pv-top { grid-template-columns: minmax(0, 1fr); }
  dialog.sheet { margin: auto auto 16px; max-height: calc(100vh - 132px); max-height: calc(100dvh - 132px); }
  .sheet-body { padding: 14px 16px 16px; }
  .sheet-foot { padding: 12px 16px; }
  .sheet-foot .btn { flex: 1 1 auto; padding-inline: 12px; }
  .sheet-foot .btn .icon { display: none; }
  .sheet-foot .pv-note { flex-basis: 100%; }
}
@media (max-width: 560px) {
  .bcard { display: grid; grid-template-columns: 130px minmax(0, 1fr); grid-template-areas: "pic info" "built built" "layout layout" "edit edit"; }
  .bpic { grid-area: pic; margin: 12px 0 0 12px; width: 118px; border-radius: 7px; align-self: start; }
  .bpic img, .bpic:hover img { transform: scale(1.04); }
  .bpic .oldchip { left: 4px; right: 4px; bottom: 4px; padding: 3px 6px; font-size: 10.5px; }
  .bpic .oldchip .icon { display: none; }
  .bcard .bbuilt + .bbuilt { grid-area: layout; }
  .picnote { display: block; padding: 10px 12px; }
  .picnote-pics { float: left; margin: 2px 10px 2px 0; }
  .picnote-pics img { width: 52px; height: 39px; }
  .epicks { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
  .binfo { grid-area: info; padding: 10px 12px 0; }
  .bbuilt { grid-area: built; margin: 10px 12px 0; }
  .bedit { grid-area: edit; padding: 10px 12px 12px; }
  .bname { font-size: 16px; }
  .addcard { min-height: 0; flex-direction: row; justify-content: flex-start; text-align: left; padding: 14px 16px; }
  .addcard .plus { width: 44px; height: 44px; flex: none; }
  .addcard-words { gap: 2px; justify-items: start; }
  .srow { grid-template-columns: 80px minmax(0, 1fr); }
  .spic { width: 80px; }
  .srow .btn { grid-column: 1 / -1; }
  .ggrid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
  .gtxt { padding: 8px 10px 10px; }
  .gpic .pill { left: 6px; top: 6px; font-size: 11.5px; padding: 2px 8px; }
  .addsize-row .money { flex-basis: 100%; }
  .addsize-row .btn { flex: 1 1 100%; }
  .sec-head .actions, .sec-head .actions .btn { width: 100%; }
  .sec-head .actions .btn { flex: 1 1 0; }
  .savebar-actions { width: 100%; }
  .savebar-actions .btn { flex: 1 1 0; }
  .card { padding: 16px; }
  .flash { grid-template-columns: minmax(0, 1fr) 44px; padding: 12px 6px 12px 14px; }
  .flash-mark { display: none; }
  .confirm .actions .btn { flex: 1 1 auto; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}

/* the end view drawing */
.ev-ground { stroke: var(--line-strong); stroke-width: 1.5; vector-effect: non-scaling-stroke; }
.ev-floor { fill: var(--sketch-floor); }
.ev-wall { fill: var(--sketch-wall); stroke: var(--sketch-roof); stroke-width: 1.2; stroke-linejoin: round; vector-effect: non-scaling-stroke; }
.ev-roof { fill: none; stroke: var(--sketch-roof); stroke-width: 5; stroke-linejoin: miter; stroke-linecap: square; }
.ev-ghost { fill: none; stroke: var(--sketch-ghost); stroke-width: 1.6; stroke-dasharray: 6 5; vector-effect: non-scaling-stroke; }
.ev-door { fill: none; stroke: var(--sketch-roof); stroke-width: 1.4; vector-effect: non-scaling-stroke; }
.ev-door-line { stroke: var(--sketch-roof); stroke-width: 1.1; vector-effect: non-scaling-stroke; }
.ev-door.bad, .ev-door-line.bad { stroke: var(--bad); stroke-width: 2.4; }
.ev-dim { stroke: var(--muted); stroke-width: 1; vector-effect: non-scaling-stroke; }
.ev-t { fill: var(--ink); font-family: var(--body); font-weight: 600; }
.ev-s { fill: var(--muted); font-family: var(--body); font-weight: 500; }
.ev-t.end, .ev-s.end { text-anchor: end; }
.ev-t.chg, .ev-s.chg { fill: var(--gold-deep); font-weight: 700; }
.endview-key b.chg { color: var(--gold-deep); }
.endview-key .ev-what { flex-basis: 100%; }
.size-row .size-err { grid-column: 2 / -1; }
.tab[aria-current="page"] { color: var(--heading); border-bottom-color: var(--gold); }
/* ---- Standard layout: the owner's own 3D designer in layout mode ----
   The look is the 3D designer's (ui/styles.css, ui/blueprint.js): dark
   header with the business badge, the light studio stage with glass pills
   and the metal price plate, the navy floor plan, and Oswald small-caps
   cards and chips. The stage and the wall drawing stay light in dark mode,
   the way the building's picture does. */
:root {
  --stage-top: #F7F7F7; --stage-bot: #E9E9E9;
  --glass: rgba(46, 41, 32, .82); --glass-edge: rgba(255, 255, 255, .32); --glass-ink: #F4EFE4;
  --plate-a: #DDE1E4; --plate-b: #C6CCD0; --plate-c: #D5DADD; --plate-edge: #A9B1B6; --plate-ink: #2C3439; --plate-sub: #5C676E;
  --kraft: #CDA97B; --kraft-ink: #5B4426;
  --wv-siding: #FBFBF8; --wv-trim: #2B2B2B; --wv-roof: #2F2F2F; --wv-crease: #5A5A5A; --wv-door: #FFFFFF; --wv-glass: #A9BCC8;
  --wv-skid: #B08A5A; --wv-ground: #BDB8AE; --wv-ink: #3A352D; --wv-accent: #85660F; --wv-bad: #B3261E; --wv-sel: #C9A227; --wv-sel-fill: rgba(201, 162, 39, .16);
  --bp-top: #10406A; --bp-bot: #0A2C49; --bp-line: #EAF4FB; --bp-core: #0E3A5F; --bp-picked: #7FD3FF; --bp-door: #F2C86B; --bp-title: #CFE3F2;
  --bp-edge: rgba(234, 244, 251, .35); --bp-floor: rgba(234, 244, 251, .06); --bp-bad: #FF9088; --bp-porch: rgba(242, 200, 107, .14);
  /* the porch, in parts/porch.js colours: stained posts and rails, a white header band */
  --wv-post: #96682F; --wv-post-edge: #5E3F17; --wv-rail: #A87B45; --wv-band: #FFFFFF; --wv-porch-bg: #EFE6D6; --wv-run-bg: #E3E6E5; --wv-mesh: #8E979A;
  --wv-ghost: #7A5A2E; --wv-ghost-fill: rgba(150, 104, 47, .12); --wv-zone-ink: #6B5634;
  /* the fixed corner posts: grey-brown and hatched, so they read as part of the porch */
  --wv-cpost: #6B665C; --wv-cpost-edge: #3F3B34; --wv-hatch: #CFC8BA;
  /* the badge, the glass pills and the metal plate's shading and rivets */
  --badge-shade: rgba(0, 0, 0, .25); --face-shadow: rgba(10, 30, 50, .25);
  --plate-shadow: rgba(20, 32, 42, .28); --plate-hi: rgba(255, 255, 255, .75); --plate-lo: rgba(70, 84, 94, .25);
  --rivet-hi: #F2F5F6; --rivet-mid: #9AA3A9; --rivet-lo: #6D777E;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --stage-top: #DCDCD8; --stage-bot: #CFCFCB;
    --wv-siding: #EEEDE8; --wv-door: #F4F3EF; --wv-ground: #A8A398;
    --wv-post: #8E622B; --wv-post-edge: #4F3412; --wv-rail: #9C7240; --wv-band: #F4F3EF; --wv-porch-bg: #E2DACB; --wv-run-bg: #D6D9D8; --wv-mesh: #7D8689;
    --wv-ghost: #6E5129; --wv-ghost-fill: rgba(142, 98, 43, .14); --wv-zone-ink: #5E4B2C; --bp-porch: rgba(242, 200, 107, .16);
    --kraft: #8C6E46; --kraft-ink: #F6EBD9;
    --wv-cpost: #625D54; --wv-cpost-edge: #36332D; --wv-hatch: #C4BDAF;
    --badge-shade: rgba(0, 0, 0, .35); --face-shadow: rgba(0, 0, 0, .45);
    --plate-shadow: rgba(0, 0, 0, .45); --plate-hi: rgba(255, 255, 255, .6); --plate-lo: rgba(40, 50, 58, .35);
    --rivet-hi: #E4E8EA; --rivet-mid: #8E979D; --rivet-lo: #5F686F;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --stage-top: #DCDCD8; --stage-bot: #CFCFCB;
  --wv-siding: #EEEDE8; --wv-door: #F4F3EF; --wv-ground: #A8A398;
  --wv-post: #8E622B; --wv-post-edge: #4F3412; --wv-rail: #9C7240; --wv-band: #F4F3EF; --wv-porch-bg: #E2DACB; --wv-run-bg: #D6D9D8; --wv-mesh: #7D8689;
  --wv-ghost: #6E5129; --wv-ghost-fill: rgba(142, 98, 43, .14); --wv-zone-ink: #5E4B2C; --bp-porch: rgba(242, 200, 107, .16);
  --kraft: #8C6E46; --kraft-ink: #F6EBD9;
  --wv-cpost: #625D54; --wv-cpost-edge: #36332D; --wv-hatch: #C4BDAF;
  --badge-shade: rgba(0, 0, 0, .35); --face-shadow: rgba(0, 0, 0, .45);
  --plate-shadow: rgba(0, 0, 0, .45); --plate-hi: rgba(255, 255, 255, .6); --plate-lo: rgba(40, 50, 58, .35);
  --rivet-hi: #E4E8EA; --rivet-mid: #8E979D; --rivet-lo: #5F686F;
  color-scheme: dark;
}

.dz { border: 1px solid var(--frame-edge); border-radius: 14px; overflow: clip; background: var(--bg); box-shadow: var(--shadow-app); }
/* the layout screen scrolls only when it says so (the picked item's sheet,
   the wall): no browser scroll anchoring, which moved the drawing under a
   finger when the sheet below it grew, so the tap's click landed elsewhere */
html:has(#dz:not([hidden])) { overflow-anchor: none; }
.dz-hdr {
  display: flex; align-items: center; gap: 10px; min-height: 58px; padding: 10px 14px; color: var(--on-frame); background-color: var(--frame);
  background-image: linear-gradient(var(--frame-grid) 1px, transparent 1px), linear-gradient(90deg, var(--frame-grid) 1px, transparent 1px);
  background-size: 22px 22px; box-shadow: 0 1px 0 var(--frame-line);
}
.dz-badge { width: 38px; height: 38px; flex: none; border-radius: 9px; display: grid; place-items: center; background: var(--gold); color: var(--on-gold); font: 700 16px/1 var(--head); box-shadow: inset 0 -2px 0 var(--badge-shade); }
.dz-words { min-width: 0; }
.dz-t1 { font: 600 15px/1.1 var(--head); letter-spacing: .12em; text-transform: uppercase; }
.dz-t2 { font-size: 11.5px; color: var(--side-text); letter-spacing: .06em; }
.dz-lots { margin-left: auto; display: inline-flex; align-items: center; gap: 6px; min-height: 36px; padding: 0 12px; border-radius: 8px; border: 1px solid var(--on-frame-25); background: var(--on-frame-06); font-size: 14px; white-space: nowrap; }
.dz-lots .icon { width: 17px; height: 17px; color: var(--on-frame-soft); }
.dz-bar { display: flex; gap: 12px; align-items: flex-start; padding: 14px var(--mx); background: var(--gold-soft); border-bottom: 1px solid var(--gold-line); color: var(--gold-ink); }
.dz-bar h1 { font: 500 clamp(19px, 2.3vw, 25px)/1.2 var(--head); letter-spacing: .02em; color: var(--heading); text-wrap: balance; }
.dz-bar h1:focus { outline: none; }
.dz-bar p { font-size: 14.5px; margin-top: 3px; max-width: 82ch; }
.dz-bar-mark { width: 38px; height: 38px; flex: none; border-radius: 50%; display: grid; place-items: center; background: var(--gold); color: var(--on-gold); margin-top: 1px; }
.dz-note { display: flex; gap: 8px; align-items: flex-start; margin: 12px var(--mx) 0; padding: 9px 12px; border-radius: 8px; background: var(--card-2); border: 1px solid var(--line); color: var(--muted); font-size: 14px; }
.dz-note .icon { width: 17px; height: 17px; margin-top: 1px; color: var(--gold-deep); }
.dz-body { display: grid; gap: 16px; padding: 16px var(--mx) 22px; grid-template-columns: minmax(0, 1fr); }
.dz-left, .dz-right { display: grid; gap: 14px; align-content: start; min-width: 0; }

/* the stage: the building as the 3D designer opens on it */
.dz-stage { position: relative; aspect-ratio: 4 / 3; background: var(--pic-bg); border-radius: 12px; overflow: hidden; border: 1px solid var(--line); }
.dz-stage img { display: block; width: 100%; height: 100%; object-fit: contain; transition: filter .3s, opacity .3s; }
.dz-stage img.old { filter: grayscale(.7) contrast(.9); opacity: .72; }
.dz-hint { position: absolute; top: 10px; left: 50%; transform: translateX(-50%); max-width: calc(100% - 24px); padding: 5px 12px; border-radius: 999px; background: var(--glass); color: var(--glass-ink); font: 500 11.5px/1.3 var(--head); letter-spacing: .06em; text-transform: uppercase; text-align: center; pointer-events: none; }
.dz-face { position: absolute; transform: translate(-50%, -50%); min-height: 44px; min-width: 44px; padding: 0 16px; border-radius: 999px; border: 1px solid var(--glass-edge); background: var(--glass); color: var(--glass-ink); font: 600 12.5px/1 var(--head); letter-spacing: .1em; text-transform: uppercase; cursor: pointer; box-shadow: 0 2px 8px var(--face-shadow); white-space: nowrap; }
.dz-face.on { background: var(--gold); color: var(--on-gold); border-color: var(--gold); }
.dz-chip { position: absolute; left: 10px; top: 46px; display: inline-flex; align-items: flex-start; gap: 6px; max-width: min(330px, calc(100% - 20px)); padding: 5px 10px; border-radius: 8px; background: var(--btn-dark); color: var(--on-btn-dark); font-size: 12.5px; font-weight: 600; line-height: 1.3; }
.dz-chip .icon { width: 14px; height: 14px; flex: none; margin-top: 1px; color: var(--on-btn-dark-mark); }
.dz-plate {
  position: absolute; left: 12px; bottom: 12px; min-width: 180px; max-width: calc(100% - 24px); padding: 9px 14px 8px; border-radius: 8px; color: var(--plate-ink);
  background: linear-gradient(168deg, var(--plate-a) 0%, var(--plate-b) 48%, var(--plate-c) 100%); border: 1px solid var(--plate-edge);
  box-shadow: 0 3px 10px var(--plate-shadow), inset 0 1px 0 var(--plate-hi), inset 0 -2px 4px var(--plate-lo);
}
.dz-plate::before, .dz-plate::after, .dz-plate .rv::before, .dz-plate .rv::after { content: ""; position: absolute; width: 7px; height: 7px; border-radius: 50%; background: radial-gradient(circle at 34% 30%, var(--rivet-hi) 0%, var(--rivet-mid) 55%, var(--rivet-lo) 100%); }
.dz-plate::before { top: 5px; left: 5px; } .dz-plate::after { top: 5px; right: 5px; }
.dz-plate .rv::before { bottom: 5px; left: 5px; } .dz-plate .rv::after { bottom: 5px; right: 5px; }
.dz-plate .l1 { font: 600 10px/1.2 var(--head); letter-spacing: .22em; text-transform: uppercase; color: var(--plate-sub); }
.dz-plate .l2 { font: 700 16px/1.2 var(--head); letter-spacing: .04em; text-transform: uppercase; }
.dz-plate .l3 { font: 600 13px/1.2 var(--head); letter-spacing: .06em; color: var(--plate-sub); text-transform: uppercase; }

/* the floor plan strip, in the designer's blueprint colours */
.dz-plan { margin: 0; border-radius: 12px; overflow: hidden; background: linear-gradient(180deg, var(--bp-top), var(--bp-bot)); padding: 10px 12px 8px; }
.plan-svg { display: block; width: 100%; height: auto; max-height: 150px; }
.bp-floor { fill: var(--bp-floor); }
.bp-wall { stroke: var(--bp-line); stroke-width: .42; stroke-linecap: square; }
.bp-wall.on { stroke: var(--bp-picked); stroke-width: .62; }
.bp-gap { stroke: var(--bp-bot); stroke-width: .8; }
.bp-door { stroke: var(--bp-door); stroke-width: .7; }
.bp-win { stroke: var(--bp-line); stroke-width: .42; }
.bp-door.sel, .bp-win.sel { stroke: var(--bp-picked); stroke-width: .9; }
.bp-door.off, .bp-win.off { stroke: var(--bp-bad); stroke-dasharray: .4 .25; }
.bp-post { fill: var(--bp-door); }
.bp-post.corner { fill: var(--bp-line); opacity: .75; }
.bp-post.sel { fill: var(--bp-picked); }
.bp-porch { fill: var(--bp-porch); stroke: var(--bp-edge); stroke-width: .12; stroke-dasharray: .4 .3; }
.bp-wall.inside { stroke-width: .26; opacity: .7; }
.bp-edge { stroke: var(--bp-picked); stroke-width: .5; stroke-dasharray: .5 .3; }
.bp-t { fill: var(--bp-title); font-family: var(--head); font-weight: 500; letter-spacing: .1em; }
.bp-size { fill: var(--bp-title); opacity: .55; font-family: var(--head); font-weight: 500; letter-spacing: .06em; }
.dz-plan { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 210px); align-items: center; gap: 8px 16px; }
.plan-cap { display: grid; gap: 8px; color: var(--bp-title); font-size: 13px; }
.plan-btns { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px; }
.plan-btn { line-height: 1.1; }
.plan-btn { min-height: 44px; min-width: 44px; padding: 0 12px; border-radius: 8px; border: 1px solid var(--bp-edge); background: transparent; color: var(--bp-line); font: 600 12.5px/1 var(--head); letter-spacing: .08em; text-transform: uppercase; cursor: pointer; }
.plan-btn.on { background: var(--bp-picked); border-color: var(--bp-picked); color: var(--bp-bot); }

/* the designer's cards */
.dz-card { background: var(--card); border: 1px solid var(--line-strong); border-radius: 11px; box-shadow: var(--shadow); padding: 15px 14px 16px; min-width: 0; }
.dz-h { display: flex; align-items: center; gap: 9px; margin: 0 0 11px; font: 600 13.5px/1.2 var(--head); letter-spacing: .14em; text-transform: uppercase; color: var(--heading); }
.dz-h .no { width: 22px; height: 22px; flex: none; border-radius: 5px; display: inline-grid; place-items: center; background: var(--kraft); color: var(--kraft-ink); font-size: 12px; letter-spacing: 0; }
.dz-sub { color: var(--muted); font-size: 14px; }
.wtabs { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; }
.wtab { display: flex; align-items: center; justify-content: center; gap: 6px; min-height: 44px; padding: 0 6px; border-radius: 8px; border: 1.5px solid var(--line-strong); background: var(--card); color: var(--muted); font: 600 13px/1 var(--head); letter-spacing: .07em; text-transform: uppercase; cursor: pointer; }
.wtab[aria-pressed="true"] { background: var(--btn-dark); border-color: var(--btn-dark); color: var(--on-btn-dark); }
.wtab[aria-pressed="true"] .count { background: var(--on-frame-25); color: var(--on-btn-dark); }
.wtabs.n5 { grid-template-columns: repeat(5, minmax(0, 1fr)); }
.wtabs.n6 { grid-template-columns: repeat(6, minmax(0, 1fr)); }
.wtab { line-height: 1.1; text-align: center; }
.wtab.porch { border-style: dashed; }
.wtab.porch[aria-pressed="true"] { border-style: solid; }
.dz-sizerow { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; margin: 12px 0 10px; font-size: 14px; }
.dz-sizerow label { font-weight: 600; }
.dz-sizerow select { flex: 1 1 200px; width: auto; }
.dz-sizehint { flex-basis: 100%; margin: -2px 0 0; }
.wv { padding: 6px 8px 4px; border-radius: 10px; border: 1px solid var(--line); background: linear-gradient(180deg, var(--stage-top) 0%, var(--stage-top) 18%, var(--stage-bot) 42%, var(--stage-bot) 100%); }
.wv-svg { display: block; width: 100%; height: auto; max-height: 360px; touch-action: pan-y; user-select: none; -webkit-user-select: none; }
.wv-cap { font-size: 13.5px; color: var(--muted); margin-top: 8px; }
.wv-links:empty { display: none; }
.wv-links { margin-top: 8px; }
.wv-porchlink { display: flex; align-items: center; gap: 10px; width: 100%; min-height: 44px; padding: 8px 12px; border-radius: 8px; border: 1.5px dashed var(--wv-ghost); background: var(--gold-soft); color: var(--gold-ink); font-size: 14px; text-align: left; cursor: pointer; }
.wv-porchlink b { white-space: nowrap; }
.wv-porchlink > span:nth-child(2) { flex: 1 1 auto; min-width: 0; }
.wv-porchlink .icon { width: 18px; height: 18px; }
.wv-swatch { flex: none; width: 10px; height: 26px; border: 1.5px dashed var(--wv-ghost); border-radius: 1px; background: var(--wv-ghost-fill); }
.wv-note { display: flex; gap: 8px; align-items: flex-start; }
.wv-note .icon { width: 16px; height: 16px; margin-top: 1px; color: var(--gold-deep); }
.wv-ground { stroke: var(--wv-ground); stroke-width: .08; }
.wv-skid { fill: var(--wv-skid); }
.wv-siding { fill: var(--wv-siding); stroke: var(--wv-trim); stroke-width: .12; stroke-linejoin: round; }
.wv-roof { fill: var(--wv-roof); }
.wv-roofline { fill: none; stroke: var(--wv-roof); stroke-width: .42; stroke-linejoin: miter; stroke-linecap: square; }
.wv-crease { stroke: var(--wv-crease); stroke-width: .07; }
.wv-trim { fill: var(--wv-trim); }
.wv-door { fill: var(--wv-door); stroke: var(--wv-trim); stroke-width: .2; }
.wv-brace { fill: none; stroke: var(--wv-trim); stroke-width: .16; }
.wv-line { stroke: var(--wv-trim); stroke-width: .05; }
.wv-line-box { fill: none; stroke: var(--wv-trim); stroke-width: .06; }
.wv-win { fill: var(--wv-trim); }
.wv-glass { fill: var(--wv-glass); }
.wv-mull { stroke: var(--wv-trim); stroke-width: .1; }
.wv-mull.wide { stroke-width: .27; }
.wv-post { fill: var(--wv-post); stroke: var(--wv-post-edge); stroke-width: .05; }
.wv-post.corner { fill: var(--wv-cpost); stroke: var(--wv-cpost-edge); }
.wv-hatch { fill: none; stroke: var(--wv-hatch); stroke-width: .05; pointer-events: none; }
.wv-post.faint, .faint { opacity: .5; }
.wv-band { fill: var(--wv-band); stroke: var(--wv-trim); stroke-width: .05; }
.wv-rail { fill: var(--wv-rail); }
.wv-baluster { fill: none; stroke: var(--wv-rail); stroke-width: .1; }
.wv-zone { fill: var(--wv-porch-bg); stroke: var(--wv-trim); stroke-width: .05; stroke-dasharray: .3 .2; }
.wv-zone.run { fill: var(--wv-run-bg); }
.wv-mesh { fill: none; stroke: var(--wv-mesh); stroke-width: .03; }
.wv-zone-t { fill: var(--wv-zone-ink); font-family: var(--head); font-weight: 600; letter-spacing: .14em; }
.wv-wayin { fill: var(--wv-accent); font-family: var(--head); font-weight: 600; letter-spacing: .12em; }
.wv-behind { opacity: .34; }
.wv-ghost { cursor: pointer; }
.wv-ghostpost { fill: var(--wv-ghost-fill); stroke: var(--wv-ghost); stroke-width: .07; stroke-dasharray: .26 .18; }
.wv-ghosthit, .wv-chit { fill: transparent; stroke: none; pointer-events: fill; }
.wv-ghost:focus, .wv-cpost:focus { outline: none; }
.wv-ghostfocus { fill: none; stroke: none; pointer-events: none; }
.wv-ghost:focus-visible .wv-ghostfocus { stroke: var(--focus); stroke-width: .14; stroke-dasharray: .35 .2; }
.wv-ghost:hover .wv-ghostpost, .wv-ghost:focus-visible .wv-ghostpost { stroke-width: .1; fill: var(--wv-sel-fill); }
.wv-cpost { cursor: help; }
.wv-it { cursor: grab; }
.wv-it.fixed { cursor: pointer; }
.wv-it:focus { outline: none; }
.wv-hit { fill: transparent; stroke: none; pointer-events: fill; }
.wv-it:focus-visible .wv-hit { stroke: var(--focus); stroke-width: .14; stroke-dasharray: .35 .2; }
.wv-selbox { fill: var(--wv-sel-fill); stroke: var(--wv-sel); stroke-width: .17; }
.wv-it.off .wv-door, .wv-it.off .wv-win, .wv-it.off .wv-glass, .wv-it.off .wv-brace { opacity: .32; }
.wv-offbox { fill: none; stroke: var(--wv-bad); stroke-width: .1; stroke-dasharray: .35 .22; }
.wv-offt { fill: var(--wv-bad); font-family: var(--body); font-weight: 700; }
.wv-mid { stroke: var(--wv-accent); stroke-width: .06; stroke-dasharray: .3 .2; }
.wv-end, .wv-len { fill: var(--wv-ink); font-family: var(--head); font-weight: 500; letter-spacing: .08em; }
.wv-dim { stroke: var(--wv-accent); stroke-width: .07; }
.wv-dimt { fill: var(--wv-accent); font-family: var(--body); font-weight: 700; }

/* the picked item's sheet */
.lsheet { border: 1.5px solid var(--btn-dark); border-radius: 12px; padding: 12px 13px 13px; }
.lsheet-top { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 4px 10px; }
.lsheet-t { font: 600 14px/1.25 var(--head); letter-spacing: .1em; text-transform: uppercase; color: var(--heading); }
.lsheet-where { font-size: 13px; color: var(--good); font-weight: 600; }
.lsheet-where .held { color: var(--gold-ink); }
.lsheet-words { margin-top: 8px; }
.lsheet-rule { display: flex; gap: 8px; align-items: flex-start; margin: 9px 0 2px; padding: 8px 10px; border-radius: 8px; background: var(--gold-soft); border: 1px solid var(--gold-line); color: var(--gold-ink); font-size: 14px; }
.lsheet-rule .icon { width: 17px; height: 17px; margin-top: 1px; }
.tglrow { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; margin-top: 10px; font-size: 14px; }
.tglrow > span:first-child { font-weight: 600; min-width: 46px; }
.wallchips, .nudge { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
.wallchips button { min-height: 44px; min-width: 44px; padding: 0 12px; border-radius: 7px; border: 1.5px solid var(--line-strong); background: var(--card); color: var(--heading); font: 600 12px/1 var(--head); letter-spacing: .07em; text-transform: uppercase; cursor: pointer; }
.wallchips button[aria-pressed="true"] { background: var(--btn-dark); border-color: var(--btn-dark); color: var(--on-btn-dark); }
/* under the Move arrows: what a move does, or why it stopped; two lines kept
   for it, so the buttons below never jump */
.lsheet-note { display: flex; gap: 6px; align-items: flex-start; min-height: calc(2 * 1.35em + 4px); margin-top: 4px; font-size: 13px; line-height: 1.35; color: var(--muted); }
.lsheet-note.said { color: var(--gold-ink); font-weight: 600; }
/* a gable window's words under Move are always one line */
.lsheet-note.one { min-height: calc(1.35em + 2px); }
.lsheet-note .icon { width: 16px; height: 16px; flex: none; margin-top: 1px; color: var(--gold-deep); }
.lsheet-rule .held { display: block; margin-top: 2px; font-weight: 600; }
.anchors { display: grid; gap: 6px; margin-top: 12px; }
.anchors .lbl { font-weight: 600; font-size: 14px; }
.anchors .anchors-now { margin: 0; }
.anchors .chiprow { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 160px), 1fr)); gap: 6px; }
.dzchip { display: inline-flex; align-items: center; gap: 6px; min-height: 44px; padding: 7px 12px; border-radius: 8px; border: 1.5px solid var(--line-strong); background: var(--card); color: var(--heading); font: 600 12.5px/1.2 var(--head); letter-spacing: .05em; text-transform: uppercase; text-align: left; cursor: pointer; }
.dzchip .icon { width: 16px; height: 16px; color: var(--gold-deep); }
.dzchip:hover { border-color: var(--gold); }
.dzchip[aria-pressed="true"] { background: var(--btn-dark); border-color: var(--btn-dark); color: var(--on-btn-dark); }
.gaprow { display: grid; gap: 6px; margin-top: 12px; }
.gaprow label { font-weight: 600; font-size: 14px; }
.gapctl { display: flex; gap: 8px; }
.gapctl input { max-width: 220px; }
.lsheet-btns { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; }
/* the buttons sit right under Move and its two lines, on every sheet */
.lsheet .lsheet-btns { margin-top: 6px; }
.lsheet .lsheet-btns + .lsheet-step + .tglrow { margin-top: 14px; }
.lsheet.post .lsheet-rule { margin-top: 12px; }
.lsheet-step { margin-top: 10px; padding: 8px 10px 10px; border-radius: 8px; border: 1px dashed var(--line-strong); }
.lsheet-step[hidden] { display: none; }
.lsheet-step p { margin: 0 0 8px; color: var(--muted); font-size: 13.5px; }
.stepbtns { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 8px; }
.stepbtns .dzbtn { padding: 4px 8px; line-height: 1.15; white-space: normal; text-align: center; }
.stepbtns .dzbtn:disabled { opacity: .45; cursor: default; }
.stepbtns .icon { width: 16px; height: 16px; flex: none; }
.dzbtn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: 44px; min-width: 44px; padding: 0 14px; border-radius: 7px; border: 1.5px solid var(--line-strong); background: var(--card); color: var(--heading); font: 600 12.5px/1 var(--head); letter-spacing: .08em; text-transform: uppercase; cursor: pointer; }
.dzbtn.icon { padding: 0; width: 44px; }
.dzbtn.icon .icon { width: 20px; height: 20px; }
.dzbtn.warn { color: var(--bad); border-color: var(--bad-line); }
.dzbtn.done { margin-left: auto; background: var(--btn-dark); color: var(--on-btn-dark); border-color: var(--btn-dark); }
.addgrp { margin-top: 10px; }
.addgrp-h { font: 600 12px/1.2 var(--body); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.addlist { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 150px), 1fr)); gap: 8px; margin: 6px 0 4px; }
.dz .btn-link { margin-top: 2px; }
.dz-price { display: flex; gap: 8px; align-items: flex-start; margin-top: 6px; }
.dz-price .icon { width: 17px; height: 17px; flex: none; margin-top: 2px; color: var(--gold-deep); }
.dz-foot { margin: 0; padding: 12px var(--mx) calc(12px + env(safe-area-inset-bottom, 0px)); }
#lay-sheet, #lay-wall { scroll-margin-top: 16px; scroll-margin-bottom: 12px; }

/* the every-size result */
.lres { display: grid; grid-template-columns: 32px minmax(0, 1fr); gap: 12px; padding: 12px 14px; border-radius: var(--radius); background: var(--good-bg); border: 1px solid var(--good-line); }
.lres p { font-size: 14.5px; }
.lres p + p { margin-top: 4px; }
.lres.bad { background: var(--bad-bg); border-color: var(--bad-line); }
.lres.bad .flash-mark { background: var(--bad); color: var(--bad-bg); }
.lprev { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 190px), 1fr)); gap: 10px; margin-bottom: 8px; }
.lprev-one { margin: 0; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; background: var(--card-2); }
.lprev-pic { padding: 6px 6px 0; background: linear-gradient(180deg, var(--stage-top) 0%, var(--stage-bot) 45%); }
.lprev-pic .wv-svg { max-height: 150px; }
.lprev-one figcaption { display: grid; gap: 1px; padding: 7px 10px 9px; font-size: 14px; }
.lprev-one .fits { color: var(--good); font-size: 13px; font-weight: 600; }
.lprev-one .leftoff { font-size: 13px; }

@media (min-width: 1100px) {
  .dz-body { grid-template-columns: minmax(0, 1.05fr) minmax(0, 1fr); align-items: start; }
  .dz-left { position: sticky; top: 16px; }
}
@media (max-width: 1099px) {
  /* one column: the building, then the wall to work on, then the rest */
  .dz-left, .dz-right { display: contents; }
  .dz-stage { order: 1; width: min(100%, 640px); justify-self: center; }
  .dz-right > :nth-child(1) { order: 2; }
  .dz-right > :nth-child(2) { order: 3; }
  .dz-plan { order: 4; }
  .dz-right > :nth-child(3) { order: 5; }
}
@media (max-width: 760px) {
  .plan-btns.n5, .plan-btns.n6 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .dz-lots { display: none; }
  .dz-bar { padding: 12px 16px; }
  .dz-bar-mark { display: none; }
  .dz-body { padding: 12px 12px 18px; }
  .dz-foot { margin: 0; }
  .dz-face { padding: 0 12px; font-size: 11.5px; }
  .dz-plate { left: 8px; right: 8px; bottom: 8px; min-width: 0; display: flex; align-items: baseline; gap: 10px; padding: 7px 12px 6px; }
  .dz-plate .l1 { display: none; }
  .dz-plate .l2 { font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
  .dz-plate .l3 { margin-left: auto; flex: none; font-size: 12px; }
  .dz-chip { top: 8px; font-size: 11.5px; }
  .dz-hint.with-chip { display: none; }
  .dz-hint { font-size: 10.5px; }
  .dz-plan { grid-template-columns: minmax(0, 1fr); }
  .plan-btns { grid-template-columns: repeat(4, minmax(0, 1fr)); }
  .lres { grid-template-columns: minmax(0, 1fr); }
  .dzbtn.done { margin-left: 0; }
}
@media (max-width: 560px) {
  .wtabs.n5, .wtabs.n6 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .anchors .chiprow { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  /* the picked item's sheet fits between the app header and the black bar */
  .dz-card { padding: 13px 12px 14px; }
  .lsheet { padding: 10px 11px 11px; }
  .tglrow { margin-top: 8px; gap: 6px 8px; }
  .tglrow > span:first-child { min-width: 0; }
  .lsheet-where { flex-basis: 100%; }
  .wallchips button { padding: 0 10px; }
  .anchors { margin-top: 10px; }
  .lsheet-btns { margin-top: 10px; display: grid; grid-template-columns: repeat(auto-fit, minmax(0, 1fr)); }
  .lsheet-btns .dzbtn { white-space: normal; line-height: 1.15; text-align: center; padding: 4px 8px; }
  .dzbtn { padding: 0 12px; }
  /* the bar keeps its words short on a phone: what it says, and the two buttons */
  .dz-foot .savebar-status:not(.ask) { min-height: 0; }
  .dz-foot .savebar-status:not(.ask) span { display: none; }
  .dz-foot .savebar-status:not(.ask) strong { font-size: 16px; }
}

/* ---- How it's built: the numbers an owner may change (model/build-settings.js KNOBS) ---- */
const KNOBS = {
  roofPitch: { label: "Roof pitch", unit: "pitch", hint: "Rise for every 12 in of run, like 5/12." },
  barnPeak: { label: "Barn roof height", unit: "byWidth", hint: "From the top of the wall to the top of the trusses, for each width. Like 4 ft 3 in." },
  wallHeight: { label: "Wall height", unit: "in", hint: "Floor to the top of the wall plate, like 7 ft 9 1/2 in." },
  eaveOverhang: { label: "Eave overhang", unit: "in", hint: "Inches the roof reaches past the long walls, measured level." },
  gableEndOverhang: { label: "Gable-end overhang", unit: "in", hint: "Inches the roof reaches past the gable ends." },
  porchDepth: { label: "Porch depth", unit: "ft", hint: "Feet from the front of the porch to the wall behind it." },
  sidePorchLengths: { label: "Side porch lengths", unit: "ftList", hint: "The lengths customers can pick, up to 4." },
  dormerSide: { label: "Dormer side", unit: "side", hint: "The long wall the dormer sits on." },
  doorHeight: { label: "Wooden shop door height", unit: "in", hint: "The opening of the wooden shop doors, like 76 1/2 in." },

const ORDER = ["roofPitch", "barnPeak", "wallHeight", "eaveOverhang", "gableEndOverhang", "porchDepth", "sidePorchLengths", "dormerSide", "doorHeight"];

const PITCH = { gable: [3, 12], lean: [1.25, 6], slope: [2, 8] };
const KIND_WORDS = { lean: "lean-to roofs", slope: "single slope roofs" };
const PORCH_CHIPS = [4, 6, 8, 10, 12, 14, 16, 18, 20];
const knobsOf = (st) => ORDER.filter((id) => st.std[id] != null);

function show(id, v) {
  if (v == null) return "";
  switch (KNOBS[id].unit) {
    case "pitch": return fmtPitch(v);
    case "ft": return fmtFt(v);
    case "byWidth": return Object.keys(v).map(Number).sort((a, b) => a - b).map((w) => `${w} ft wide: ${fmtIn(v[w])}`).join(", ");
    case "ftList": return listWords(v.map((n) => `${n} ft`));

}
function stdOf(st, id) {
  const w = st.std[id];

  const s = w.replace(/^about /, "");
  switch (KNOBS[id].unit) {
    case "pitch": return readPitch(s);
    case "byWidth": {
      const o = {};
      for (const part of s.split(/,\s*/)) { const m = /^(\d+) ft wide: (.+)$/.exec(part); if (m) o[m[1]] = readLength(m[2], "in").value; }
      return o;
    }

}
function parseKnob(id, text, st) {
  const K = KNOBS[id], t = String(text).trim();
  if (K.unit === "pitch") {
    const v = readPitch(t);
    if (v == null) return { problem: `${K.label}: write it like 5/12.` };
    if (Math.abs(v * 4 - Math.round(v * 4)) > 1e-9) return { problem: `${K.label}: use quarter steps, like 5 1/4/12.` };
    let [lo, hi] = PITCH[st.roof] || [1, 12];
    if (st.roof === "gable" && st.metal) lo = 4;
    if (v > hi) return { problem: `${K.label} ${fmtPitch(v)} is steeper than ${hi}/12, the steepest the 3D designer draws${st.roof !== "gable" ? " on " + KIND_WORDS[st.roof] : ""}.` };
    if (v < lo) return { problem: st.metal && st.roof === "gable" ? `${K.label} ${fmtPitch(v)} is flatter than ${fmtPitch(lo)}, the flattest the 3D designer can frame a metal roof.` : `${K.label} ${fmtPitch(v)} is flatter than ${fmtPitch(lo)}, the flattest the 3D designer ${st.roof !== "gable" ? "can frame on " + KIND_WORDS[st.roof] : "draws"}.` };
    return { value: v };
  }
  const r = readLength(t, K.unit);
  const like = K.unit === "ft" ? "4 ft or 4 ft 6 in" : id === "wallHeight" ? "7 ft 9 1/2 in" : id === "doorHeight" ? "76 1/2 in" : "4 in";
  if (!r || !isFinite(r.value) || r.value < 0) return { problem: `${K.label}: write it like ${like}.` };
  const v = r.value;
  const [lo, hi] = id === "eaveOverhang" ? (st.roof === "barn" ? [0, 3] : [0, 12]) : LIMITS[id];
  const sh = (x) => show(id, x);
  if (v > hi + 1e-9) {
    if (id === "eaveOverhang" && st.roof === "barn") return { problem: `${K.label} ${sh(v)} is more than a barn roof can take: ${sh(hi)} at most.` };
    const hint = !r.unitGiven && K.unit === "ft" && v / 12 >= lo && v / 12 <= hi ? ` Did you mean ${sh(v / 12)}?` : "";
    const word = K.unit === "ft" ? "deeper" : id === "wallHeight" || id === "doorHeight" ? "taller" : "more";
    const tail = id === "eaveOverhang" || id === "gableEndOverhang" ? ", the most the 3D designer draws" : "";
    return { problem: `${K.label} ${sh(v)} is ${word} than ${sh(hi)}${tail}.${hint}` };
  }
  if (v < lo - 1e-9) {
    const hint = !r.unitGiven && K.unit === "in" && v * 12 >= lo && v * 12 <= hi ? ` Did you mean ${fmtIn(v * 12)}?` : "";
    const word = K.unit === "ft" ? "shallower" : id === "wallHeight" || id === "doorHeight" ? "lower" : "less";
    return { problem: `${K.label} ${sh(v)} is ${word} than ${sh(lo)}.${hint}` };

  const [lo, hi] = LIMITS.barnPeak;
  if (r.value < lo || r.value > hi) return { problem: `Barn roof height for the ${w} ft wide barn: ${fmtIn(r.value)} is not between ${fmtIn(lo)} and ${fmtIn(hi)}.` };
  return { value: Math.round(r.value * 1e4) / 1e4 };
}

function placeToasts() {
  let off = 22;
  for (const sel of ["#savebar", ".tabbar", "#dz-foot"]) {
    const el = document.querySelector(sel);
    if (!el || !el.offsetParent) continue;
    const r = el.getBoundingClientRect();
    if (r.height && r.top < window.innerHeight && r.bottom > 0) off = Math.max(off, window.innerHeight - r.top + 12);
  }
  const box = $("#toasts");
  box.style.bottom = `calc(${Math.round(off)}px + env(safe-area-inset-bottom, 0px))`;
  /* on the layout screen a message never lies over the picked item's sheet
     (its heading, Move arrows and buttons): it goes just above the sheet's
     card, or to the top of the screen (below the room kept for a phone app's
     header) */
  const sheet = S.route.screen === "layout" && box.children.length && document.querySelector("#lay-sheet .lsheet") ? document.querySelector("#lay-sheet") : null;
  if (!sheet) return;
  const tb = box.getBoundingClientRect(), r = sheet.getBoundingClientRect(), top = parseFloat(getComputedStyle(document.documentElement).scrollPaddingTop) || 16;
  if (r.bottom <= tb.top || r.top >= tb.bottom) return;

  const above = [r.top - 8, document.querySelector("#lay-sheet .lsheet").getBoundingClientRect().top - 8].find((y) => y - tb.height >= top);

/* the every-size check, said the way the Dealer Center says it */
function sizeCheck(values) {
  const st = curStyle(), v = valsWith(values);
  const zs = sortSizes(Object.keys(D.sizes));
  const widths = [...new Set(zs.map(widthOf))];
  const found = [];
  const at = (list) => (list.length === zs.length ? (zs.length > 1 ? `The same at all ${zs.length} sizes.` : "") : `At ${listWords(list.map(sizeWords))}.`);
  for (const sd of st.side) {
    const need = doorTop(sd, v) + (st.roof === "barn" ? 4 : 6);
    if (v.wallHeight < need - 1e-6) {
      found.push({ minWall: need, words: `With ${fmtIn(v.wallHeight)} walls, the roof edge comes down ${fracWords(Math.ceil((need - v.wallHeight) * 8) / 8)} inches in front of the top of the ${sd.name} ${sd.wall === "inside the porch" ? "inside the porch" : "on the " + sd.wall}. ${at(zs)}`, door: true });
    }
  }
  if (st.main.wall === "F" || st.main.wall === "B") {
    const t = doorTop(st.main, v), bad = [];
    let worst = 0, minWall = 0;
    for (const w of widths) {
      const W = w * 12, x0 = Math.max(0, (W - Math.min(st.main.width, W - 12)) / 2), rise = riseAt(st, v, W, x0);
      const room = v.wallHeight + rise - 6;
      if (room < t - 1e-6) { bad.push(w); worst = Math.max(worst, t - room); minWall = Math.max(minWall, t + 6 - rise); }
    }
    if (bad.length) found.push({ minWall, door: true, words: `With ${fmtIn(v.wallHeight)} walls, the top of the ${st.main.name} runs ${fracWords(Math.ceil(worst * 8) / 8)} inches into the roof on the ${st.main.wall === "F" ? "front" : "back"} end. ${at(zs.filter((z) => bad.indexOf(widthOf(z)) >= 0))}` });
  }
  if (st.roof === "gable" || st.roof === "lean" || st.roof === "slope") {
    const low = widths.filter((w) => (st.roof === "gable" ? w * 6 : w * 12) * v.roofPitch / 12 < 12 - 1e-6);
    if (low.length) {
      const w = low[0], rise = (st.roof === "gable" ? w * 6 : w * 12) * v.roofPitch / 12;
      found.push({ words: `At ${fmtPitch(v.roofPitch)}, the roof peak is only ${fmtInOnly(rise)} above the wall on the ${w} ft wide sizes (1 ft at least). ${at(zs.filter((z) => low.indexOf(widthOf(z)) >= 0))}` });
    }
  }
  if (v.porchDepth != null && st.porch && /across the front|wraps/.test(st.porch)) {
    const tight = zs.filter((z) => lengthOf(z) - v.porchDepth < 4);
    if (tight.length) found.push({ words: `A ${fmtFt(v.porchDepth)} porch leaves only ${fmtFt(lengthOf(tight[0]) - v.porchDepth)} of room inside the ${sizeWords(tight[0])} (4 ft at least). ${at(tight)}` });
  }
  return { count: zs.length, found };
}

/* the dimension under the picked item: its gap to the corner it keeps, or
