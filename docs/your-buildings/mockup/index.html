/* ---- the floor plan strip (the 3D designer's blueprint): front at the left ---- */
function planHTML() {
  const code = LAY.code, pt = PORCH_TYPE[code], pd = porchDepthFor(code);
  const W = widthOf(LAY.z), L = lengthOf(LAY.z), Lp = pt === "C" ? L + pd : L;
  const ps = curPlacements().filter((p) => !p.skip && ITEM[p.cat].kind !== "gable");
  const pad = Math.max(2.2, Lp * 0.1), vw = Lp + 2 * pad;
  /* room above and below for LEFT SIDE and RIGHT SIDE: a long building is drawn
     smaller, so its words take more feet */
  const box = document.querySelector("#dz-plan .plan-box"), boxW = box && box.clientWidth ? box.clientWidth : 300;
  let padY = 2.2, vh = W + 2 * padY, pxPerFt = 1, fs = 1;
  for (let i = 0; i < 3; i++) {
    vh = W + 2 * padY;
    pxPerFt = Math.min(boxW / vw, 150 / vh); fs = 11.5 / pxPerFt;
    padY = Math.max(2.2, 0.45 + fs * 1.25);
  }
  vh = W + 2 * padY; pxPerFt = Math.min(boxW / vw, 150 / vh); fs = 11.5 / pxPerFt;
  const X = (x) => (x + pad).toFixed(3), Y = (y) => (y + padY).toFixed(3);
  const V = curView();
  /* where an item's middle is, in plan feet (x from the front, y across from the left side) */
  const fx = pt === "F" || pt === "C" ? pd : 0;
  const at = (wall, pos) => wall === "R" ? [(pt === "F" ? (L + pd) / 2 : Lp / 2) + pos, W] : wall === "L" ? [(pt === "F" ? (L + pd) / 2 : Lp / 2) - pos, 0] : wall === "F" ? [fx, W / 2 + pos] : [Lp, W / 2 - pos];
  const postAt = (wall, pos) => wall === "F" ? [0.2, W / 2 + pos] : [Lp / 2 + pos, W - 0.2];
  let s = `<svg viewBox="0 0 ${vw.toFixed(3)} ${vh.toFixed(3)}" class="plan-svg" role="img" aria-label="Floor plan of the ${sizeWords(LAY.z)} from above, front at the left">`;
  s += `<rect x="${X(0)}" y="${Y(0)}" width="${Lp}" height="${W}" class="bp-floor"/>`;
  /* the walls, and the porch the floor runs out under */
  let edge, inside = [], porch = null;
  if (pt === "F") { edge = { F: [[pd, 0], [pd, W]], B: [[L, 0], [L, W]], L: [[pd, 0], [L, 0]], R: [[pd, W], [L, W]] }; porch = [[0, 0], [pd, 0], [pd, W], [0, W]]; }
  else if (pt === "S") {
    const P = sidePorchLen(code, L);
    edge = { F: [[0, 0], [0, W - pd]], B: [[L, 0], [L, W]], L: [[0, 0], [L, 0]], R: [[P, W], [L, W]] };
    inside = [[[0, W - pd], [P, W - pd]], [[P, W - pd], [P, W]]]; porch = [[0, W - pd], [P, W - pd], [P, W], [0, W]];
  } else if (pt === "C") {
    edge = { F: [[pd, 0], [pd, 4]], B: [[Lp, 0], [Lp, W]], L: [[pd, 0], [Lp, 0]], R: [[12, W], [Lp, W]] };
    inside = [[[pd, 4], [pd + 4, W - pd]], [[pd + 4, W - pd], [12, W - pd]], [[12, W - pd], [12, W]]];
    porch = [[0, 0], [pd, 0], [pd, 4], [pd + 4, W - pd], [12, W - pd], [12, W], [0, W]];
  } else edge = { F: [[0, 0], [0, W]], B: [[L, 0], [L, W]], L: [[0, 0], [L, 0]], R: [[0, W], [L, W]] };
  if (porch) s += `<polygon points="${porch.map(([x, y]) => `${X(x)},${Y(y)}`).join(" ")}" class="bp-porch"/>`;
  for (const w of WALLS) {
    const [[x1, y1], [x2, y2]] = edge[w];
    s += `<line x1="${X(x1)}" y1="${Y(y1)}" x2="${X(x2)}" y2="${Y(y2)}" class="bp-wall${!V.porch && V.wall === w ? " on" : ""}"/>`;
  }
  for (const [[x1, y1], [x2, y2]] of inside) s += `<line x1="${X(x1)}" y1="${Y(y1)}" x2="${X(x2)}" y2="${Y(y2)}" class="bp-wall inside"/>`;
  if (V.porch) {
    const f = porchFace(code, V, W, L);
    const [a, b] = V.face === "front" ? [[0, 0], [0, W]] : [[Lp / 2 + f.x0, W], [Lp / 2 + f.x1, W]];
    s += `<line x1="${X(a[0])}" y1="${Y(a[1])}" x2="${X(b[0])}" y2="${Y(b[1])}" class="bp-edge on"/>`;

    s += `<line x1="${X(ax)}" y1="${Y(ay)}" x2="${X(bx)}" y2="${Y(by)}" class="${k === "door" ? "bp-door" : "bp-win"}${p.ok ? "" : " off"}${LAY.sel && LAY.sel.id === p.e.id ? " sel" : ""}"/>`;

  if (ev.key === "Enter" && ev.target.id === "lay-gap") { ev.preventDefault(); setGap(); }
});
function setGap() {
  const e = selEntry(), inp = $("#lay-gap");
  if (!e || !inp) return;
  const r = readLength(inp.value, "in");
  const len = wallLenOf(LAY.code, e.wall, widthOf(LAY.z), lengthOf(LAY.z)), w = itemW(e.cat, e.dbl);
  const max = e.k === "pair" ? len / 2 - w - 0.31 : len - w - CORNER_FT;
  if (!r || !isFinite(r.value)) LAY.gapErr = "Write it like 1 ft 6 in.";
  else if (r.value / 12 < CORNER_FT - 1e-9) LAY.gapErr = "At least 6 in. A door or window needs 6 in of wall past it.";
  else if (r.value / 12 > max + 1e-9) LAY.gapErr = `On the ${sizeWords(LAY.z)} that runs past the ${e.k === "pair" ? "middle" : "other corner"}: ${ftWords(Math.max(CORNER_FT, max))} at most.`;
  else { LAY.gapErr = ""; e.gap = roundIn(r.value / 12); touch(e); }
  refreshLayout();
  restoreFocus("#lay-gap");
}

/* ---- leaving and saving ---- */
function askLayoutLeave(then) {
  LAY.confirmLeave = then;
  $("#dz-foot").innerHTML = footHTML();
  setBarH();
  const k = $("#lay-leave-no"); if (k) k.focus();
}
function backToEdit(opts) {
  const id = D.id;
  LAY = null;
  S.route = { screen: "edit", id };
  render();
  const sec = $("#sec-doors");
  if (sec) { sec.scrollIntoView({ block: "start" }); const h = $("#t-doors"); if (h) h.focus({ preventScroll: true }); }
  if (opts && opts.toast) toast(opts.toast, opts.kind);
}
function saveLayout() {
  if (!layDirty() || LAY.checking) return;
  LAY.checking = true;
  $("#dz-foot").innerHTML = footHTML();
  setBarH();
  setTimeout(() => {
    if (!LAY) return;
    LAY.checking = false;
    const res = checkLayout(LAY.entries, LAY.code, LAY.sizes);
    const refused = res.doorBad.length > 0 || res.noDoor.length > 0;
    if (!refused) commitLayout();
    $("#dz-foot").innerHTML = footHTML();
    setBarH();
    openLayoutResult(res, refused);
  }, 1100);
}
function commitLayout() {
  const builder = isBuilderLayout(LAY.code, LAY.entries, LAY.sizes);
  const saved = builder ? null : JSON.parse(JSON.stringify(LAY.entries));
  if (D.isNew) D.newLayout = saved;
  else {
    const b = findB(D.id);
    notePictures();
    b.layout = saved; b.layoutOn = saved ? TODAY : null;
    S.changedOn = "today";
  }
  LAY.orig = canon(LAY.entries);
  LAY.savedNow = true;
}
function previewSizes() {
  const zs = LAY.sizes, st = BY[LAY.code];
  const typical = zs.indexOf(st.drawn) >= 0 ? st.drawn : zs[Math.floor((zs.length - 1) / 2)];
  const out = [["Smallest", zs[0]], ["Typical", typical], ["Largest", zs[zs.length - 1]]];
  return out.filter((x, i) => out.findIndex((y) => y[1] === x[1]) === i);
}
/* the builder's doors the owner took off, as entries to put back */
function missingBuilderDoors() {
  const all = builderEntries(LAY.code, LAY.sizes).filter((x) => ITEM[x.cat].kind === "door");
  return all.filter((x) => !LAY.entries.some((e) => (e.key && e.key === x.key) || (e.keys && x.keys && same(e.keys, x.keys))));
}
function openLayoutResult(res, refused) {
  const view = LAY.lastWall || LAY.wall, V = viewOf(view);
  const lines = checkWords(res);
  const fix = refused ? whenFix(res, LAY.entries, LAY.code) : null;
  LAY.fix = fix;
  const noDoor = refused && res.noDoor.length > 0;
  const doorBack = noDoor ? missingBuilderDoors() : [];
  const b = D.isNew ? null : findB(D.id);
  const vs = b ? versionsOf(b).filter((v) => v.selling) : [];
  const noDoorZ = new Set(res.noDoor);
  const prev = previewSizes().map(([word, z]) => {
    const here = placeAt(LAY.entries, LAY.code, z).filter((p) => !p.skip && p.wall === V.wall);
    const offHere = here.filter((p) => !p.ok), twoInOne = V.porch && stackedPosts(here).length;
    const cap = noDoorZ.has(z) ? `<span class="leftoff">No door</span>` : offHere.length ? `<span class="leftoff">${esc(offHere.map((p) => (ITEM[p.cat].kind === "door" ? "a door doesn't fit" : `${ITEM[p.cat].say} left off`)).filter((x, i, a) => a.indexOf(x) === i).join(", "))}</span>` : twoInOne ? `<span class="leftoff">Two posts in one spot</span>` : `<span class="fits">Everything fits</span>`;
    return `<figure class="lprev-one"><div class="lprev-pic">${wallSVG(view, z, { small: true, px: 230 })}</div>
      <figcaption><span><b>${word}</b> · ${sizeWords(z)}</span>${cap}</figcaption></figure>`;
  }).join("");
  const head = noDoor ? "Not saved yet: every size needs a door" : refused ? "Not saved yet: a door doesn't fit on every size" : D.isNew ? "Kept as the standard layout" : "Saved as the standard layout";
  const after = noDoor ? `<p>Add a door from Add a door or window${doorBack.length ? ", or tap Put the builder's door back" : ""}, then tap Save as standard.</p>`
    : refused ? `<p>Doors must fit on every size, so nothing changed in the 3D designer.${fix ? "" : " Move that door, or remove it, and save again."}</p>`
    : D.isNew ? `<p>It's kept with the new building and saved for every lot when you tap Add for all lots.</p>`
    : `<p>Every lot's 3D designer starts customers from it now. They can still move, add or remove doors, windows and porch posts on their own building.</p>`;
  sheet.innerHTML = `<div class="sheet-head"><h2 id="sheet-title" tabindex="-1">${esc(head)}</h2><button type="button" class="sheet-x" data-act="lay-result-x" aria-label="Close">${icon("x")}</button></div>
    <div class="sheet-body">
      <div class="lres ${refused ? "bad" : "good"}"><span class="flash-mark">${icon(refused ? "alert" : "check")}</span>
        <div><p><strong>Checked ${plural(res.count, "size")}.</strong> ${lines.length ? esc(lines[0]) : "Everything fits on every size."}</p>
        ${lines.slice(1).map((l) => `<p>${esc(l)}</p>`).join("")}
        ${after}</div></div>
      <div><p class="pv-sub">How the ${esc(V.long)} carries over</p>
        <div class="lprev">${prev}</div>
        <p class="hint">${V.porch ? "A porch post keeps its distance from the middle, or from the corner or the front of the porch it was set from. It's held on the porch edge on smaller sizes." : "Centered stays centered. An item near an end keeps its gap to that corner. A matched pair stays matched."}</p></div>
      ${!refused && vs.length ? `<p class="hint">${esc(vs.map((v) => `Your ${v.name} keeps its own layout.`).join(" "))}</p>` : ""}
    </div>
    <div class="sheet-foot">${refused
      ? `${fix ? `<button type="button" class="btn btn-ghost" data-act="lay-fix">${esc(fix.words)}</button>` : ""}${doorBack.length ? `<button type="button" class="btn btn-ghost" data-act="lay-door-back">${doorBack.length > 1 ? "Put the builder's doors back" : "Put the builder's door back"}</button>` : ""}<button type="button" class="btn btn-primary" data-act="lay-result-x">Keep working</button>`
      : `<button type="button" class="btn btn-primary" data-act="lay-result-done">${icon("arrowLeft")}Back to Edit building</button>`}</div>`;
  LAY.result = refused ? "refused" : "saved";
  if (!sheet.open) { try { sheet.showModal(); } catch (err) { sheet.setAttribute("open", ""); } }
  sheet.scrollTop = 0;
  const t = $("#sheet-title"); if (t) t.focus({ preventScroll: true });
}
sheet.addEventListener("close", () => {
  if (LAY && LAY.result === "saved") { LAY.result = null; finishSaved(); }
  else if (LAY) LAY.result = null;
});
function finishSaved() {
  const name = LAY.name;
  backToEdit({ toast: D.isNew ? `The ${name} will start customers from your layout once you add it.` : `Saved the standard layout for the ${name}. Every lot's 3D designer starts customers from it now.` });
}

/* ---- every tap on the layout screen and the Edit page's layout card ---- */
function layoutAct(act, t) {
  switch (act) {
    case "lay-open": D.confirmLayoutReset = false; openLayout(); break;
    case "lay-reset": D.confirmLayoutReset = true; redrawDoorsCard(); { const y = $("#lay-reset-yes"); if (y) y.focus(); } break;
    case "lay-reset-no": D.confirmLayoutReset = false; redrawDoorsCard(); { const o = main.querySelector("[data-act=lay-reset]"); if (o) o.focus(); } break;
    case "lay-reset-yes": {
      D.confirmLayoutReset = false;
      const b = findB(D.id);
      notePictures();
      if (b) { b.layout = null; b.layoutOn = null; S.changedOn = "today"; }
      render();
      const sec = $("#sec-doors"); if (sec) { sec.scrollIntoView({ block: "start" }); $("#t-doors").focus({ preventScroll: true }); }
      toast(`Back to the builder's layout. Every lot's 3D designer starts customers from it now.`);
      break;
    }
    case "lay-wall": {
      const fromPicture = t.classList.contains("dz-face"), fromLink = t.classList.contains("wv-porchlink");
      LAY.wall = t.dataset.wall; LAY.sel = null; LAY.gapErr = ""; LAY.note = null;
      refreshLayout();
      if (fromPicture || fromLink) { const tab = $(`#lay-tabs [data-wall="${LAY.wall}"]`); revealWall(); if (tab) tab.focus({ preventScroll: true }); }
      break;
    }
    case "lay-add": addItem(t.dataset.cat); break;
    case "lay-builder": LAY.entries = builderEntries(LAY.code, LAY.sizes); LAY.sel = null; refreshLayout(); toast("Back to the builder's layout here. Save as standard to use it on every lot.", "info"); break;
    case "lay-done-sel": LAY.sel = null; LAY.gapErr = ""; LAY.note = null; refreshLayout(); break;
    case "lay-step": {
      const n = stepTarget(+t.dataset.k);
      if (!n) { toast(`There's nothing further ${+t.dataset.k < 0 ? "left" : "right"} in this row.`, "info"); break; }
      LAY.sel = { id: n.e.id, part: n.part || 0 }; LAY.gapErr = ""; LAY.note = null;
      refreshLayout();
      if ($("#lay-step") && $("#lay-step").hidden) revealPick();
      break;
    }
    case "lay-remove": {
      const e = selEntry(); if (!e) break;
      const view = viewKeyOf(e);
      LAY.entries = LAY.entries.filter((x) => x !== e); LAY.sel = null; LAY.note = null; touch(e); LAY.lastWall = view;
      refreshLayout();
      toast(`Removed ${e.k === "pair" || e.k === "bpair" ? `both ${ITEM[e.cat].say}s` : `the ${ITEM[e.cat].say}`} from the ${isPostCat(e.cat) ? "porch" : WALL_LONG[e.wall]}.`);
      break;
    }
    case "lay-unmatch": {
      const e = selEntry(); if (!e) break;
      const a = posOf(e, 0), b = posOf(e, 1);
      const one = { id: nextId(), cat: e.cat, wall: e.wall, dbl: e.dbl, k: "center" }, two = { id: nextId(), cat: e.cat, wall: e.wall, dbl: e.dbl, k: "center" };
      infer(one, a); infer(two, b);
      LAY.entries.splice(LAY.entries.indexOf(e), 1, one, two);
      LAY.sel = { id: (LAY.sel.part ? two : one).id, part: 0 }; touch(e);
      refreshLayout(); break;
    }
    case "lay-match": {
      const e = selEntry(); if (!e) break;
      const pos = posOf(e, LAY.sel.part);
      if (e.k === "builder") infer(e, pos);
      e.k = "pair"; infer(e, Math.abs(pos)); LAY.sel = { id: e.id, part: pos < 0 ? 0 : 1 }; touch(e);
      refreshLayout(); toast(`Added a matching ${ITEM[e.cat].say} on the other side of the middle.`); break;
    }
    case "lay-dup": {
      /* the real designer's Duplicate: a copy one post width and 0.9 ft along,
         turning back the other way where the copy would be held at the end;
         then stepped clear of the other posts (layout mode's own rule) */
      const e = selEntry(); if (!e) break;
      const pos = posOf(e, 0), step = ITEM[e.cat].w + 0.9;
      let at = clampPos(e, pos + step), dir = 1;
      if (Math.abs(at - pos) < step - 0.01) { at = clampPos(e, pos - step); dir = -1; }
      const c = clearOfPosts(e.wall, at, dir);
      const n = { id: nextId(), cat: e.cat, wall: e.wall, k: e.k === "builder" ? null : e.k };
      LAY.entries.push(n); inferPost(n, c.pos);
      LAY.sel = { id: n.id, part: 0 }; LAY.note = null; touch(n);
      refreshLayout();
      toast(`Added another porch post, ${postWhereWords(n)}${postBeforeDoor(n) ? ", in front of the door" : ""}.${c.beside ? " It's right beside another post." : ""} Drag it where you want it.`);
      break;
    }
    case "lay-anchor": { const e = selEntry(); if (!e) break; setAnchor(e, t.dataset.k); LAY.gapErr = ""; refreshLayout(); restoreFocus(`[data-act="lay-anchor"][data-k="${t.dataset.k}"]`); break; }
    case "lay-gap-set": setGap(); break;
    case "lay-nudge": {
      const e = selEntry(); if (!e) break;
      const arrow = `[data-act="lay-nudge"][data-d="${t.dataset.d}"]`, y0 = t.getBoundingClientRect().top;
      const moved = nudge(e, +t.dataset.d, 0.25);
      /* the end of where it may go is said in the sheet, beside the arrows, not in a pop-up over the buttons */
      LAY.note = moved ? null : { id: e.id, words: e.k === "pair" || e.k === "bpair" ? "That's as far as the pair can go on this size." : limitWords(e, +t.dataset.d < 0 ? "lo" : "hi") };
      refreshLayout(); restoreFocus(arrow);
      /* the arrow stays under the finger, tap after tap, even when the words
         above it grow a line ("2 items don't fit on this size") */
      const now = $(`#lay-sheet ${arrow}`), dy = now ? now.getBoundingClientRect().top - y0 : 0;
      if (Math.abs(dy) > 0.5) window.scrollBy(0, dy);
      break;
    }
    case "lay-move-wall": {
      const e = selEntry(); if (!e || e.wall === t.dataset.wall) break;
      const pos = posOf(e, LAY.sel.part);
      if (e.k === "builder" || e.k === "bpair") infer(e, e.k === "bpair" ? Math.abs(pos) : pos);
      e.wall = t.dataset.wall;
      if (e.k === "start" || e.k === "end") { const len = wallLenOf(LAY.code, e.wall, widthOf(LAY.z), lengthOf(LAY.z)); e.gap = Math.min(e.gap, Math.max(CORNER_FT, len - itemW(e.cat, e.dbl) - CORNER_FT)); }
      LAY.wall = e.wall; touch(e); refreshLayout();
      toast(`Moved it to the ${WALL_LONG[e.wall]}.`); break;
    }
    case "lay-save": saveLayout(); break;
    case "lay-cancel": if (layDirty()) askLayoutLeave(() => backToEdit()); else backToEdit(); break;
    case "lay-leave-no": LAY.confirmLeave = null; $("#dz-foot").innerHTML = footHTML(); setBarH(); break;
    case "lay-leave-yes": { const then = LAY.confirmLeave; LAY.confirmLeave = null; then(); break; }
    case "lay-result-x": closeSheet(); break;
    case "lay-result-done": closeSheet(); break;
    case "lay-fix": {
      const f = LAY.fix; if (!f) break;
      const e = LAY.entries.find((x) => x.id === f.id); if (e) e.when = f.when;
      LAY.result = null; closeSheet(); refreshLayout();
      toast(`${f.words.replace("Only put it", "It's only")}. Save as standard to check every size again.`, "info");
      break;
    }
    case "lay-door-back": {
      const back = missingBuilderDoors(); if (!back.length) break;
      LAY.entries = back.concat(LAY.entries);
      LAY.wall = back[0].wall; LAY.sel = null;
      LAY.result = null; closeSheet(); refreshLayout(); revealWall();
      toast(`The builder's ${ITEM[back[0].cat].say} is back on the ${WALL_LONG[back[0].wall]}. Tap Save as standard to check every size again.`, "info");
      break;
    }
  }
}

/* fill the frame's icons, then open on the screen the link names (#empty, #gallery, #edit-UT, #layout-LB, #preview-DS, #new-LB) */
for (const el of $$("[data-icon]")) el.insertAdjacentHTML("afterbegin", icon(el.dataset.icon));
(function boot() {
  let h = "";
  try { h = decodeURIComponent((location.hash || "").slice(1)); } catch (e) { h = ""; }
  if (h === "empty") startEmpty(); else resetSample();
  if (h === "gallery") { S.route = { screen: "gallery" }; render(); return; }
  let m = /^edit-([A-Z0-9]+)$/.exec(h);
  if (m && findB(m[1])) { D = draftFrom(findB(m[1])); S.route = { screen: "edit", id: m[1] }; render(); return; }
  m = /^preview-([A-Z]+)$/.exec(h);
  if (m && BY[m[1]]) { S.route = { screen: "gallery" }; render(); openPreview(m[1]); return; }
  m = /^layout-([A-Z0-9]+)$/.exec(h);
  if (m && findB(m[1])) { D = draftFrom(findB(m[1])); S.route = { screen: "edit", id: m[1] }; openLayout(); return; }
  m = /^new-([A-Z]+)$/.exec(h);
  if (m && BY[m[1]]) { openNew(m[1], !!findB(m[1])); return; }
  S.route = { screen: "list" }; render();
})();
</script>
