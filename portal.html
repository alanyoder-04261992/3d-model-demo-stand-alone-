<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0A2C49">
  <meta name="robots" content="noindex,nofollow">
  <title>Dealer workspace | Barnwright</title>
  <link rel="stylesheet" href="/ui/portal.css">
</head>
<body>
  <a class="skip-link" href="#workspace">Skip to workspace</a>
  <div id="portal">
    <aside class="rail" aria-label="Workspace navigation">
      <a class="wordmark" href="/portal.html" aria-label="Barnwright dealer workspace">
        <svg viewBox="0 0 38 36" aria-hidden="true"><path d="M3 33V14L10 5 19 1l9 4 7 9v19H3Zm11 0V20h10v13M3 14l16-7 16 7" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linejoin="round"/></svg>
        <span>Barnwright<small>Dealer workspace</small></span>
      </a>
      <div id="scope" class="scope" hidden></div>
      <nav id="navigation" aria-label="Main" hidden></nav>
      <div id="account" class="account" hidden></div>
      <p class="rail-note">The right building.<br>The right dealer.</p>
    </aside>
    <main id="workspace" tabindex="-1">
      <div id="demo-banner" class="notice" role="status" hidden>Demo workspace · Sample data only. Changes reset when you refresh or sign out.</div>
      <div id="notice" class="notice" role="status" aria-live="polite" hidden></div>
      <div id="content" aria-busy="true"><div class="loading">Opening your workspace…</div></div>
    </main>
  </div>
  <noscript><p class="no-script">Enable JavaScript to sign in and manage your dealer workspace.</p></noscript>
  <script type="module" src="/ui/portal.js"></script>
</body>
</html>
